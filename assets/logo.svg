<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 96">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1f44"/>
      <stop offset="1" stop-color="#123a7a"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a5fc0"/>
      <stop offset="1" stop-color="#1e4fa3"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e4fa3"/>
      <stop offset="1" stop-color="#0f2f66"/>
    </linearGradient>
  </defs>

  <!-- Badge bulat -->
  <rect x="3" y="3" width="90" height="90" rx="22" fill="url(#bg)" stroke="#d4af37" stroke-width="3"/>

  <!-- Matahari emas -->
  <circle cx="62" cy="28" r="9" fill="#d4af37"/>
  <circle cx="62" cy="28" r="13" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.4"/>

  <!-- Bukit belakang -->
  <path d="M8 78 L34 42 L50 60 L66 36 L88 78 Z" fill="url(#hillBack)"/>

  <!-- Bukit depan -->
  <path d="M8 78 L28 54 L44 72 L58 50 L88 78 Z" fill="url(#hillFront)"/>

  <!-- Bendera emas di puncak -->
  <line x1="66" y1="36" x2="66" y2="24" stroke="#d4af37" stroke-width="2.5"/>
  <path d="M66 24 L78 28 L66 32 Z" fill="#d4af37"/>

  <!-- Garisan tanah bawah -->
  <rect x="8" y="76" width="80" height="4" rx="2" fill="#d4af37" opacity="0.85"/>

  <!-- Wordmark (versi header - teks putih) -->
  <text x="108" y="50" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">Mr <tspan fill="#f0c75e">Tanah</tspan></text>
  <text x="108" y="70" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="3.5" fill="#9fb3d1">TANAH &amp; HARTA</text>
</svg>
