<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>MT Board — Damage Reports (Admin) — Zentra Portal</title>
<style>
  :root { --mt:#123a7a; --mt-tua:#0a1f44; --hijau:#14905c; --oren:#e8862e; --ungu:#7a4bbd; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; background:#f2f6f4; color:#1d2b24; line-height:1.5; }
  .topbar { background:linear-gradient(135deg,#0a5c3c 0%,#123a7a 60%,#14905c 100%); color:#fff; padding:14px 16px; position:sticky; top:0; z-index:5; }
  .topbar h1 { font-size:17px; } .topbar p { font-size:12px; opacity:.92; }
  .wrap { max-width:860px; margin:0 auto; padding:14px 12px 60px; }
  .card { background:#fff; border-radius:14px; padding:14px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:12px; }
  .card h2 { font-size:14px; color:var(--mt-tua); margin-bottom:9px; }
  .kpi { display:flex; gap:7px; margin-bottom:12px; flex-wrap:wrap; }
  .kpi div { flex:1; min-width:88px; background:#fff; border-radius:12px; padding:10px 6px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.07); }
  .kpi b { display:block; font-size:17px; color:var(--mt-tua); } .kpi span { font-size:10px; color:#5a6b61; }
  table { width:100%; border-collapse:collapse; font-size:12.2px; }
  th { background:#eef3f7; color:var(--mt-tua); text-align:left; padding:7px 6px; font-size:11px; }
  td { padding:8px 6px; border-top:1px solid #e9f0ec; vertical-align:top; }
  tr.tap { cursor:pointer; } tr.tap:hover td { background:#f7fbf9; }
  .num { text-align:right; white-space:nowrap; }
  .meta { background:#f6faf8; border:1px solid #e0eae3; border-radius:11px; padding:11px 12px; font-size:12.6px; }
  .meta b { color:var(--mt-tua); }
  .st { font-size:9.8px; font-weight:800; border-radius:20px; padding:2px 8px; display:inline-block; white-space:nowrap; }
  .s-wait { background:#eef3f7; color:#5a6b61; } .s-claim { background:#fff1dc; color:#8a4c00; }
  .s-ok { background:#e5f4ec; color:#0e5a33; } .s-bad { background:#fdeaea; color:#a12; }
  .s-priv { background:#f3eefb; color:#5b34a3; }
  label { display:block; font-size:12.3px; font-weight:600; margin:10px 0 4px; }
  input,select,textarea { width:100%; padding:9px 11px; border:1.5px solid #cfdcd4; border-radius:10px; font-size:14.5px; background:#fbfdfc; }
  textarea { min-height:64px; }
  .row { display:flex; gap:9px; } .row > div { flex:1; }
  .btn { width:100%; padding:12px; background:var(--mt); color:#fff; border:0; border-radius:11px; font-size:14.5px; font-weight:700; cursor:pointer; margin-top:11px; }
  .btn.o { background:var(--oren); } .btn.g { background:#eef3f7; color:var(--mt-tua); } .btn.u { background:var(--ungu); }
  .btn:disabled { opacity:.55; cursor:not-allowed; }
  .ok { background:#e5f4ec; border:1px solid #bfe3cf; color:#0e5a33; border-radius:11px; padding:11px; font-size:12.8px; margin-top:10px; }
  .err { background:#fdeaea; border:1px solid #f2c2c2; color:#8c1f1f; border-radius:11px; padding:11px; font-size:12.8px; margin-top:10px; }
  .priv { background:#f3eefb; border:1px solid #ddd0f2; border-radius:11px; padding:11px; font-size:12.5px; color:#4a2b8a; margin-top:10px; }
  .hint { font-size:11.3px; color:#5a6b61; margin-top:5px; }
  .chk { display:flex; gap:8px; align-items:flex-start; font-size:12.5px; margin-top:6px; font-weight:400; }
  .chk input { width:17px; height:17px; margin-top:2px; accent-color:var(--mt); }
  .foot { text-align:center; font-size:11px; color:#6a7a71; margin-top:14px; }
  .hide { display:none !important; }
  .link { font-size:11.5px; word-break:break-all; background:#f2f7fb; border:1px dashed #b9cde0; border-radius:9px; padding:8px; margin-top:6px; }
  .splash { text-align:center; padding:34px 16px; color:#5a6b61; font-size:14px; }
  .parti { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .parti div { background:#f6faf8; border:1px solid #e0eae3; border-radius:10px; padding:9px 10px; font-size:11.8px; }
  .parti span { display:block; font-size:10px; font-weight:800; color:#5a6b61; text-transform:uppercase; letter-spacing:.3px; margin-bottom:2px; }
  .parti b { color:var(--mt-tua); font-size:12.3px; }
  .rate { font-size:10.5px; font-weight:800; color:#8a4c00; background:#fff4e2; border-radius:20px; padding:2px 7px; display:inline-block; }
  .tl { position:relative; padding-left:20px; }
  .tl:before { content:""; position:absolute; left:5px; top:6px; bottom:6px; width:2px; background:#dfe8e3; }
  .ev { position:relative; padding-bottom:12px; font-size:12.2px; }
  .ev:before { content:""; position:absolute; left:-19px; top:4px; width:11px; height:11px; border-radius:50%; background:#cfdcd4; border:2px solid #fff; box-shadow:0 0 0 1.5px #cfdcd4; }
  .ev.done:before { background:var(--hijau); box-shadow:0 0 0 1.5px var(--hijau); }
  .ev.now:before { background:var(--oren); box-shadow:0 0 0 3px #f8d9b5; }
  .ev b { color:var(--mt-tua); display:block; font-size:12.5px; }
  .ev i { font-style:normal; color:#6a7a71; font-size:11px; }
  .ev p { color:#4c5c53; font-size:12.1px; }
</style>
</head>
<body>
  <div class="topbar">
    <h1>📋 MT Board — Damage Reports</h1>
    <p>Zahir / Fadilah · MT team actions (internal)</p>
  </div>
  <div class="wrap" id="wrap"><div class="splash">Loading…</div></div>
<script>
var API = "https://script.google.com/macros/s/AKfycbwafaViIuCpc-Q0XnUpSHgkKVTFcyfPProf0GvSi9C-L22hUsZ_NA-03wXjd2F-GRIS/exec";
var wrap = document.getElementById("wrap");
var D = null, AKTIF = "";
function tok(){ return localStorage.getItem("mt_admin_token") || ""; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function rp(n){ return "RM " + (Number(n)||0).toFixed(2); }
function bersih(x){ return String(x||"").replace(/\s*\|\s*[Uu]nit:.*$/i, ""); }
function fmtDT(s){
  if (!s) return "";
  var d = new Date(s);
  if (isNaN(d.getTime())) return esc(s);
  function p(n){ return (n < 10 ? "0" : "") + n; }
  return p(d.getDate()) + "/" + p(d.getMonth()+1) + "/" + d.getFullYear() + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
function splash(h){ wrap.innerHTML = '<div class="splash">' + h + '</div>'; }
function post(p){ p.admin_token = tok(); return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(p)}).then(function(r){return r.json();}); }
function cls(s){ s=String(s||"").toUpperCase();
  if (s.indexOf("SELESAI")>=0||s.indexOf("QC LULUS")>=0||s.indexOf("DIBAYAR")>=0) return "s-ok";
  if (s.indexOf("TOLAK")>=0||s.indexOf("GAGAL")>=0) return "s-bad";
  if (s.indexOf("MENUNGGU")>=0||s.indexOf("SEBUT HARGA")>=0||s.indexOf("TUNTUTAN")>=0||s.indexOf("KERJA")>=0) return "s-claim";
  return "s-wait"; }

/* ---------- sign in ---------- */
function login(){
  wrap.innerHTML = '<div class="card"><h2>🔐 MT Board Access</h2>' +
    '<p class="hint">Enter the MT admin token (stored on this phone only, never sent anywhere except the MT webhook).</p>' +
    '<label>Admin token</label><input type="password" id="tk" placeholder="mtadm-…">' +
    '<button class="btn" id="bLogin">Sign in</button><div id="mLogin"></div></div>';
  document.getElementById("bLogin").onclick = function(){
    var v = document.getElementById("tk").value.trim();
    if (!v) { document.getElementById("mLogin").innerHTML = '<div class="err">Token is required.</div>'; return; }
    localStorage.setItem("mt_admin_token", v);
    load();
  };
}

/* ---------- load board ---------- */
function load(){
  splash("Loading board…");
  post({ form:"papan" }).then(function(d){
    if (!d.ok) { localStorage.removeItem("mt_admin_token"); login(); return; }
    D = d; renderPapan();
  }).catch(function(){ splash("Failed to load. <a href='#' onclick='load();return false'>Try again</a>"); });
}

function renderPapan(){
  var t = D.tiket || [], aktif = t.filter(function(x){ return x.status !== "SELESAI"; });
  var h = '<div class="kpi">' +
    '<div><b>' + aktif.length + '</b><span>active tickets</span></div>' +
    '<div><b>' + t.filter(function(x){return /MENUNGGU|DILULUSKAN|SEBUT HARGA/.test(x.status);}).length + '</b><span>waiting for owner/approval</span></div>' +
    '<div><b>' + t.filter(function(x){return /KERJA|QC|SIAP|TERIMAAN/.test(x.status);}).length + '</b><span>in progress/QC</span></div>' +
    '<div><b>' + t.filter(function(x){return x.status === "SELESAI";}).length + '</b><span>completed</span></div></div>';

  h += '<div class="card"><h2>🗂️ All Tickets ' + (D.masa ? '<span class="hint" style="font-weight:400">(' + esc(D.masa) + ')</span>' : '') + '</h2>';
  if (!t.length) h += '<p class="hint">No report tickets yet.</p>';
  else {
    h += '<table><tr><th>Ref</th><th>Property / Owner</th><th>Selected contractor</th><th>Agent</th><th>Status</th><th class="num">Approved</th><th></th></tr>';
    t.slice().reverse().forEach(function(x){
      h += '<tr class="tap" data-ref="' + esc(x.ref) + '"><td><b>' + esc(x.ref) + '</b><br><span class="hint">' + fmtDT(x.tarikh) + '</span></td>' +
        '<td>' + esc(x.unit) + '<br><span class="hint">' + esc(x.jenis) + '</span><br><b style="font-size:11.5px">' + esc(x.pemilik || x.pelapor || "-") + '</b>' +
        (x.pemilik_tel ? ' <span class="hint">' + esc(x.pemilik_tel) + '</span>' : '') + '</td>' +
        '<td>' + (x.kontraktor ? '<b>' + esc(x.kontraktor) + '</b>' + (x.rating && x.rating.nilai ? ' <span class="rate">★' + x.rating.nilai + '</span>' : '') : '<span class="hint">not selected yet</span>') + '</td>' +
        '<td>' + (x.dirujuk ? '<span class="st s-priv">🔒 ' + esc(x.dirujuk) + '</span>' : '<span class="hint">—</span>') + '</td>' +
        '<td><span class="st ' + cls(x.status) + '">' + esc(x.status) + '</span>' + (x.no_wo ? '<br><span class="hint">' + esc(x.no_wo) + '</span>' : '') + '</td>' +
        '<td class="num">' + (x.diluluskan ? rp(x.diluluskan) : "—") +
        (x.kos_urus ? '<br><span class="hint">cost ' + rp(x.kos_urus) + '</span>' : '') + '</td>' +
        '<td>›</td></tr>';
    });
    h += '</table>';
  }
  h += '<button class="btn g" id="bOut">Sign out (remove token from this phone)</button></div>';
  wrap.innerHTML = h;
  [].forEach.call(wrap.querySelectorAll("tr.tap"), function(r){ r.onclick = function(){ detail(r.getAttribute("data-ref")); }; });
  document.getElementById("bOut").onclick = function(){ localStorage.removeItem("mt_admin_token"); login(); };
}

/* ---------- ticket detail ---------- */
function detail(ref){
  AKTIF = ref;
  splash("Loading ticket " + ref + "…");
  post({ form:"detail", ref:ref }).then(function(d){
    if (!d.ok) { splash("❌ " + esc(d.error) + " <a href='#' onclick='renderPapan();return false'>Back</a>"); return; }
    renderDetail(d);
  });
}

function renderDetail(d){
  var t = d.tiket, w = d.wo, h = "";
  h += '<div class="card"><h2>👈 <a href="#" id="bBack" style="color:#123a7a;text-decoration:none">Back to board</a></h2>' +
    '<div class="meta"><b>' + esc(t.ref) + '</b> · <span class="st ' + cls(t.status) + '">' + esc(t.status) + '</span><br>' +
    '<b>📍 Property:</b> ' + esc(t.unit) + '<br><b>Reported by:</b> ' + esc(t.nama) + ' (' + esc(t.wa) + ') · ' + esc(t.emel) +
    '<br><b>Type:</b> ' + esc(t.jenis) + '<br><b>Description:</b> ' + esc(t.keterangan).replace(/\n/g,"<br>") +
    '<br><b>Cost category:</b> ' + esc(t.kategori || "-") + ' · <b>Responsibility:</b> ' + esc(t.tanggungjawab || "-") +
    (t.dirujuk ? '<br><b>🔒 Agent referral:</b> ' + esc(t.dirujuk) : '') +
    (t.folder ? '<br><a href="' + esc(t.folder) + '" target="_blank" style="color:#123a7a">📁 Ticket folder</a>' : '') + '</div></div>';

  /* v18: parties involved + progress timeline */
  var P = d.pihak || {}, pm = P.pemilik || {}, ej = P.ejen, pK = P.kontraktor, mtp = P.mt || {};
  h += '<div class="card"><h2>👥 Parties Involved</h2><div class="parti">' +
    '<div><span>Property owner</span><b>' + esc(pm.nama || "-") + '</b>' + esc(pm.tel || "") + '</div>' +
    '<div><span>Reported by</span><b>' + esc((P.pelapor||{}).nama || "-") + '</b>' + esc((P.pelapor||{}).tel || "") + '</div>' +
    '<div><span>Selected contractor</span>' + (pK ? '<b>' + esc(pK.nama) + '</b>' + esc(pK.telefon || "") + ' ' + (pK.rating && pK.rating.nilai ? '<span class="rate">★ ' + pK.rating.nilai + '/5</span>' : '') : '<b>Not selected yet</b>') + '</div>' +
    '<div><span>Referral agent</span>' + (ej ? '<b>' + esc(ej.nama) + '</b>' + (ej.ren ? 'REN ' + esc(ej.ren) + ' · ' : '') + esc(ej.tel || "") : '<b>—</b>') + '</div>' +
    '<div><span>MT Manager</span><b>' + esc(mtp.nama || "Mr Tanah") + '</b>' + esc(mtp.tel || "016-3119076") + '</div>' +
    '<div><span>Reference</span><b>' + esc(t.ref) + '</b>' + (w ? 'WO ' + esc(w.no_wo) : '') + '</div>' +
    '</div></div>';

  if (d.timeline && d.timeline.length) {
    h += '<div class="card"><h2>🕒 Progress Timeline (' + d.timeline.length + ')</h2><div class="tl">';
    d.timeline.forEach(function(e, i){
      h += '<div class="ev ' + (i === d.timeline.length - 1 ? "now" : "done") + '"><b>' + esc(e.aksi) + '</b>' +
           '<i>' + esc(e.masa) + (e.oleh ? ' · ' + esc(e.oleh) : '') + '</i>' +
           (bersih(e.butiran) ? '<p>' + esc(bersih(e.butiran)) + '</p>' : '') + '</div>';
    });
    h += '</div></div>';
  }

  /* quotations */
  h += '<div class="card"><h2>📊 Quotations (' + d.sebutharga.length + ')</h2>';
  if (d.sebutharga.length) {
    h += '<table><tr><th>Contractor</th><th class="num">Total</th><th>Duration</th><th>Status</th><th></th></tr>';
    d.sebutharga.forEach(function(s){
      h += '<tr><td>' + esc(s.kontraktor) + '</td><td class="num">' + rp(s.jumlah) + '</td><td>' + esc(s.tempoh) + 'd / ' + esc(s.waranti) + ' mo</td>' +
        '<td><span class="st ' + cls(s.status) + '">' + esc(s.status) + '</span></td>' +
        '<td>' + (s.status === "DIPILIH" && !w ? '<button class="pick" data-wo="' + esc(s.ref_sh) + '" style="background:#14905c;color:#fff;border:0;border-radius:8px;padding:6px 9px;font-size:11.5px;font-weight:700;cursor:pointer">Issue WO</button>' : '') + '</td></tr>';
    });
    h += '</table>';
  } else h += '<p class="hint">No quotations yet.</p>';

  var bolehRfq = !d.sebutharga.some(function(s){return s.status === "DIMINTA" || s.status === "DITERIMA" || s.status === "DIPILIH";});
  if (bolehRfq) {
    h += '<div style="border-top:1px dashed #dbe6e0;margin-top:11px;padding-top:9px"><b>Send RFQ to contractors</b>' +
      '<label>Scope of work</label><textarea id="rfqSkop">' + esc(t.keterangan || "") + '</textarea>' +
      '<div class="row"><div><label>Reply required before</label><input type="date" id="rfqHarap"></div>' +
      '<div><label>Cost category</label><select id="rfqKat"><option value="Baiki">Repair</option><option value="Penggantian">Replacement</option><option value="Peningkatan">Upgrade</option></select></div></div>' +
      '<div class="row"><div><label>Responsible party</label><select id="rfqTj"><option value="Pem&#105;lik">Owner</option><option value="Peny&#101;wa">Tenant</option><option value="JMB/Strata">JMB/Strata</option><option value="Insurans">Insurance</option></select></div>' +
      '<div><label>🔒 Agent referral (if any)</label><select id="rfqEjen"><option value="">— none —</option>';
    (D.ejen || []).forEach(function(e){ h += '<option>' + esc(e.nama) + '</option>'; });
    (D.kontraktor && D.kontraktor.length ? [] : []).forEach(function(){});
    h += '</select></div></div>' +
      '<label>Owner — for the approval link</label>' +
      '<div class="row"><div><input type="text" id="rfqPNama" placeholder="Owner name"></div>' +
      '<div><input type="text" id="rfqPEmel" placeholder="Owner email"></div></div>' +
      '<label>Select contractors (' + (D.kontraktor||[]).length + ' in the panel)</label>';
    (D.kontraktor || []).forEach(function(k){
      h += '<label class="chk"><input type="checkbox" class="kcek" value="' + esc(k.id) + '" data-nama="' + esc(k.nama) + '" data-emel="' + esc(k.emel) + '" data-wa="' + esc(k.wa) + '">' +
        '<span><b>' + esc(k.nama) + '</b> — ' + esc(k.kepakaran) + ' · ' + esc(k.kawasan || "") + ' · ' + esc(k.status || "") + '</span></label>';
    });
    h += '<button class="btn o" id="bRfq">📨 Send RFQ</button><div id="mRfq"></div></div>';
  }
  h += '</div>';

  /* WO + stages */
  if (w) {
    h += '<div class="card"><h2>📄 ' + esc(w.no_wo) + ' <span class="st ' + cls(w.status) + '">' + esc(w.status) + '</span></h2>' +
      '<div class="meta"><b>Contractor:</b> ' + esc(w.kontraktor) + ' · <b>Total:</b> ' + rp(w.jumlah) +
      '<br><b>MT management cost:</b> ' + rp(w.kos) + ' (' + esc(w.kos_pct) + '%) · <b>Retention:</b> ' + esc(w.retensi_pct) + '% (cap ' + rp(w.had_retensi) + ')' +
      '<br><b>Start:</b> ' + esc(w.mula) + ' · <b>Target completion:</b> ' + esc(w.siap) + (w.siap_sebenar ? ' · <b>Actual completion:</b> ' + esc(w.siap_sebenar) : '') +
      '<br><b>QC:</b> ' + esc(w.qc || "-") + ' · <b>Acceptance:</b> ' + esc(w.terimaan || "-") + ' · <b>Warranty until:</b> ' + esc(w.waranti || "-") + ' · <b>Review:</b> ' + (w.review ? esc(w.review) + "★" : "-") +
      (w.dirujuk ? '<br><b>🔒 Referred:</b> ' + esc(w.dirujuk) + ' (' + esc(w.kadar_ref) + '%)' : '') + '</div>';
    if (d.tahap.length) {
      h += '<table style="margin-top:9px"><tr><th>Stage</th><th>Item</th><th class="num">Value</th><th class="num">🔒Cost</th><th class="num">🔒Ret</th><th class="num">🔒Pay C</th><th>Status</th><th></th></tr>';
      d.tahap.forEach(function(s){
        h += '<tr><td>' + esc(s.tahap) + '</td><td>' + esc(s.perkara) + '</td><td class="num">' + rp(s.nilai) + '</td>' +
          '<td class="num">' + rp(s.kos) + '</td><td class="num">' + rp(s.retensi) + '</td><td class="num">' + rp(s.bayar_k) + '</td>' +
          '<td><span class="st ' + cls(s.status) + '">' + esc(s.status) + '</span></td><td>' +
          (s.status === "TUNTUTAN" ? '<button class="pick" data-sah="' + esc(s.ref_tahap) + '" style="background:#14905c;color:#fff;border:0;border-radius:8px;padding:5px 8px;font-size:11px;font-weight:700;cursor:pointer">Approve</button>' : '') +
          '</td></tr>';
      });
      h += '</table>';
    }
    /* actions */
    h += '<div style="border-top:1px dashed #dbe6e0;margin-top:10px;padding-top:9px">';
    if (w.status === "SIAP (MENUNGGU QC)") h += '<button class="btn" id="bQc">✅ QC — PASS</button><button class="btn g" id="bQcG">❌ QC — FAIL (request repair)</button>';
    h += '<button class="btn u" id="bVo">➕ Add VO (extra work)</button>' +
      '<div id="voBox" class="hide"><label>VO item</label><input type="text" id="voPerkara">' +
      '<label>Amount (RM)</label><input type="text" id="voAmaun"><button class="btn u" id="bVoHantar">Send VO</button></div>' +
      '<div id="mWo"></div></div></div>';
    /* payments */
    h += '<div class="card"><h2>💳 Payments</h2>';
    if (d.bayaran.length) {
      h += '<table><tr><th>Ref</th><th>Direction</th><th>Party</th><th class="num">Amount</th><th>Status</th></tr>';
      d.bayaran.forEach(function(b){ h += '<tr><td>' + esc(b.ref) + '</td><td><span class="st ' + (b.arah === "MASUK" ? "s-ok" : "s-claim") + '">' + esc(b.arah) + '</span></td><td>' + esc(b.pihak) + '</td><td class="num">' + rp(b.amaun) + '</td><td>' + esc(b.status) + '</td></tr>'; });
      h += '</table>';
    }
    h += '<div class="row"><div><label>Direction</label><select id="byArah"><option value="MASUK">IN (from owner)</option><option value="KELUAR">OUT (to contractor)</option></select></div>' +
      '<div><label>Amount (RM)</label><input type="text" id="byAmaun"></div></div>' +
      '<div class="row"><div><label>Party</label><input type="text" id="byPihak"></div>' +
      '<div><label>Stage (reference)</label><select id="byTahap"><option value="">—</option>';
    d.tahap.forEach(function(s){ h += '<option value="' + esc(s.ref_tahap) + '">' + esc(s.tahap) + ' — ' + esc(s.perkara) + '</option>'; });
    h += '</select></div></div><button class="btn" id="bBayar">Record payment</button><div id="mBy"></div></div>';
  }

  /* referral */
  if (d.referral && d.referral.length) {
    h += '<div class="card"><h2><span style="color:#5b34a3">🔒 Referral Payments (internal)</span></h2>';
    d.referral.forEach(function(r){
      h += '<div class="priv"><b>' + esc(r.ref) + '</b> · ' + esc(r.ejen) + ' · management cost ' + rp(r.kos) + ' × ' + esc(r.kadar) + '% = <b>' + rp(r.amaun) + '</b> · ' + esc(r.status) +
        (r.status !== "DIBAYAR" ? '<button class="pick" data-refbayar="' + esc(r.ref) + '" style="background:#7a4bbd;color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:11.5px;font-weight:700;cursor:pointer;display:block;margin-top:7px">Mark as PAID to agent</button>' : '') + '</div>';
    });
    h += '<p class="hint">Payment is made only once, after MT receives full payment from the owner.</p></div>';
  }

  /* access links */
  h += '<div class="card"><h2>🔗 Generate Access Links</h2>' +
    '<div class="row"><div><label>Role</label><select id="akPer"><option value="PEMILIK">Owner</option><option value="KONTRAKTOR">Contractor</option></select></div>' +
    '<div><label>Name</label><input type="text" id="akNama"></div></div>' +
    '<label>Email (send link)</label><input type="text" id="akEmel">' +
    '<label>Reference</label><input type="text" id="akRujuk" value="' + esc(w ? w.no_wo : t.ref) + '">' +
    '<button class="btn g" id="bAkses">Generate link</button><div id="mAkses"></div></div>';

  h += '<div class="card"><button class="btn g" id="bBack2">👈 Back to board</button></div>';
  wrap.innerHTML = h;
  document.getElementById("bBack").onclick = function(e){ e.preventDefault(); renderPapan(); };
  document.getElementById("bBack2").onclick = function(){ renderPapan(); };
  bindDetail(d, w);
}

function bindDetail(d, w){
  var b1 = document.getElementById("bRfq");
  if (b1) b1.onclick = function(){
    var sel = [].filter.call(wrap.querySelectorAll(".kcek"), function(c){ return c.checked; });
    if (!sel.length) { document.getElementById("mRfq").innerHTML = '<div class="err">Select at least 1 contractor.</div>'; return; }
    b1.disabled = true; b1.textContent = "Sending…";
    post({ form:"rfq", ref_tiket: AKTIF, skop: document.getElementById("rfqSkop").value,
      tarikh_harap: document.getElementById("rfqHarap").value, kategori_kos: document.getElementById("rfqKat").value,
      tanggungjawab: document.getElementById("rfqTj").value, dirujuk_ejen: document.getElementById("rfqEjen").value,
      pemilik_nama: document.getElementById("rfqPNama").value, pemilik_emel: document.getElementById("rfqPEmel").value,
      kontraktor: sel.map(function(c){ return { id:c.value, nama:c.getAttribute("data-nama"), emel:c.getAttribute("data-emel"), wa:c.getAttribute("data-wa") }; }) })
    .then(function(r){
      b1.disabled = false; b1.textContent = "📨 Send RFQ";
      if (!r.ok) { document.getElementById("mRfq").innerHTML = '<div class="err">❌ ' + esc(r.error) + '</div>'; return; }
      var x = '<div class="ok">✅ RFQ sent (' + r.rfq.length + ' contractors).</div>';
      if (r.link_pemilik) x += '<div class="link">🏡 OWNER link:<br>' + esc(r.link_pemilik) + '</div>';
      r.rfq.forEach(function(q){ x += '<div class="link">🔧 ' + esc(q.kontraktor) + ' (' + esc(q.ref_sh) + '):<br>' + esc(q.link) + '</div>'; });
      document.getElementById("mRfq").innerHTML = x;
    });
  };
  [].forEach.call(wrap.querySelectorAll("button[data-wo]"), function(b){
    b.onclick = function(){
      var ref = b.getAttribute("data-wo");
      var m = prompt("Start date (YYYY-MM-DD):", new Date().toISOString().slice(0,10)); if (!m) return;
      var s = prompt("Target completion date (YYYY-MM-DD):"); if (!s) return;
      b.disabled = true; b.textContent = "…";
      post({ form:"wo", ref_tiket:AKTIF, ref_sh:ref, tarikh_mula:m, tarikh_siap:s }).then(function(r){
        alert(r.ok ? "WO " + r.no_wo + " issued — " + r.tahap + " payment stages generated." : "❌ " + r.error);
        detail(AKTIF);
      });
    };
  });
  [].forEach.call(wrap.querySelectorAll("button[data-sah]"), function(b){
    b.onclick = function(){
      b.disabled = true;
      post({ form:"sahkan", ref_tahap:b.getAttribute("data-sah"), keputusan:"SAH" }).then(function(r){ alert(r.ok ? "✅ Claim approved (" + r.status + ")" : "❌ " + r.error); detail(AKTIF); });
    };
  });
  [].forEach.call(wrap.querySelectorAll("button[data-refbayar]"), function(b){
    b.onclick = function(){ if (!confirm("Mark this referral as PAID?")) return; b.disabled = true;
      post({ form:"referralbayar", ref:b.getAttribute("data-refbayar") }).then(function(r){ alert(r.ok ? "✅ Referral paid " + rp(r.amaun) : "❌ " + r.error); detail(AKTIF); }); };
  });
  var q = document.getElementById("bQc");
  if (q) q.onclick = function(){ q.disabled = true; post({ form:"qc", no_wo:w.no_wo, keputusan:"LULUS" }).then(function(r){ alert(r.ok ? "✅ QC LULUS" : "❌ " + r.error); detail(AKTIF); }); };
  var qg = document.getElementById("bQcG");
  if (qg) qg.onclick = function(){ var n = prompt("Reason for QC failure:"); if (n === null) return;
    post({ form:"qc", no_wo:w.no_wo, keputusan:"GAGAL", nota:n }).then(function(r){ alert(r.ok ? "QC FAIL recorded" : "❌ " + r.error); detail(AKTIF); }); };
  var bv = document.getElementById("bVo");
  if (bv) bv.onclick = function(){ document.getElementById("voBox").classList.toggle("hide"); };
  var bvh = document.getElementById("bVoHantar");
  if (bvh) bvh.onclick = function(){
    bvh.disabled = true;
    post({ form:"vo", no_wo:w.no_wo, perkara:document.getElementById("voPerkara").value, amaun:document.getElementById("voAmaun").value })
    .then(function(r){ alert(r.ok ? "✅ VO approved — new contract " + rp(r.jumlah_kontrak) : "❌ " + r.error); detail(AKTIF); });
  };
  var bb = document.getElementById("bBayar");
  if (bb) bb.onclick = function(){
    bb.disabled = true;
    var arah = document.getElementById("byArah").value.indexOf("MASUK") === 0 ? "MASUK" : "KELUAR";
    post({ form:"bayar", ref_tiket:AKTIF, no_wo:w.no_wo, arah:arah, amaun:document.getElementById("byAmaun").value,
      pihak:document.getElementById("byPihak").value, ref_tahap:document.getElementById("byTahap").value,
      kaedah:"Pindahan bank" })
    .then(function(r){ document.getElementById("mBy").innerHTML = r.ok ? '<div class="ok">✅ ' + r.ref + ' — ' + r.arah + ' ' + rp(r.amaun) + ' recorded</div>' : '<div class="err">❌ ' + esc(r.error) + '</div>'; bb.disabled = false; });
  };
  var ba = document.getElementById("bAkses");
  if (ba) ba.onclick = function(){
    ba.disabled = true;
    post({ form:"akses", peranan:document.getElementById("akPer").value, nama:document.getElementById("akNama").value,
      emel:document.getElementById("akEmel").value, rujukan:document.getElementById("akRujuk").value })
    .then(function(r){ document.getElementById("mAkses").innerHTML = r.ok ? '<div class="link">✅ ' + esc(r.peranan) + ':<br>' + esc(r.link) + '</div>' : '<div class="err">❌ ' + esc(r.error) + '</div>'; ba.disabled = false; });
  };
}

if (tok()) { load(); }
else {
  var q = new URLSearchParams(location.search).get("t") || "";
  if (q) {
    localStorage.setItem("mt_admin_token", q);
    try { history.replaceState(null, "", location.pathname); } catch (e) {}   // remove token from URL
    load();
  } else login();
}
</script>
