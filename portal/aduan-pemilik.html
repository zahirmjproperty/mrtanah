<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Portal Tuan Rumah — Aduan & Kelulusan — Mr Tanah</title>
<style>
  :root { --mt:#123a7a; --mt-tua:#0a1f44; --hijau:#14905c; --oren:#e8862e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; background:#f2f6f4; color:#1d2b24; line-height:1.5; }
  .topbar { background:linear-gradient(135deg,#0a5c3c 0%,#123a7a 60%,#14905c 100%); color:#fff; padding:16px; }
  .topbar h1 { font-size:18px; } .topbar p { font-size:12.5px; opacity:.92; margin-top:2px; }
  .wrap { max-width:600px; margin:0 auto; padding:14px 14px 48px; }
  .card { background:#fff; border-radius:14px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:13px; }
  .card h2 { font-size:14.5px; color:var(--mt-tua); margin-bottom:10px; }
  .meta { background:#f6faf8; border:1px solid #e0eae3; border-radius:11px; padding:11px 12px; font-size:12.7px; }
  .meta b { color:var(--mt-tua); }
  table { width:100%; border-collapse:collapse; font-size:12.2px; }
  th { background:#eef3f7; color:var(--mt-tua); text-align:left; padding:7px 6px; font-size:11px; }
  td { padding:9px 6px; border-top:1px solid #e9f0ec; vertical-align:top; }
  tr.sel { background:#e8f5ee; }
  .num { text-align:right; white-space:nowrap; }
  .pick { background:var(--hijau); color:#fff; border:0; border-radius:8px; padding:7px 10px; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .pick.off { background:#dfe8e3; color:#7a8a80; }
  .btn { width:100%; padding:13px; background:var(--oren); color:#fff; border:0; border-radius:11px; font-size:15px; font-weight:700; cursor:pointer; margin-top:12px; }
  .btn.sec { background:var(--mt); } .btn.ghost { background:#eef3f7; color:var(--mt-tua); }
  .btn:disabled { opacity:.55; cursor:not-allowed; }
  .ok { background:#e5f4ec; border:1px solid #bfe3cf; color:#0e5a33; border-radius:11px; padding:12px; font-size:13px; margin-top:11px; }
  .err { background:#fdeaea; border:1px solid #f2c2c2; color:#8c1f1f; border-radius:11px; padding:12px; font-size:13px; margin-top:11px; }
  .st { font-size:10px; font-weight:800; border-radius:20px; padding:2px 8px; display:inline-block; }
  .s-wait { background:#eef3f7; color:#5a6b61; } .s-claim { background:#fff1dc; color:#8a4c00; }
  .s-ok { background:#e5f4ec; color:#0e5a33; } .s-bad { background:#fdeaea; color:#a12; }
  .stars { font-size:32px; letter-spacing:6px; color:#d8dfdb; cursor:pointer; text-align:center; margin:6px 0; }
  .stars b { color:#f0a83c; }
  textarea { width:100%; padding:10px 12px; border:1.5px solid #cfdcd4; border-radius:10px; font-size:15px; min-height:70px; background:#fbfdfc; }
  label { display:block; font-size:12.5px; font-weight:600; margin:11px 0 4px; }
  .hint { font-size:11.5px; color:#5a6b61; margin-top:6px; }
  .foot { text-align:center; font-size:11px; color:#6a7a71; margin-top:16px; }
  .splash { text-align:center; padding:40px 16px; color:#5a6b61; font-size:14px; }
</style>
</head>
<body>
  <div class="topbar">
    <h1>🏡 Portal Tuan Rumah</h1>
    <p>Mr Tanah — Aduan kerosakan, kelulusan &amp; terimaan kerja</p>
  </div>
  <div class="wrap" id="wrap"><div class="splash">Memuatkan…</div></div>
<script>
var API = "https://script.google.com/macros/s/AKfycbwafaViIuCpc-Q0XnUpSHgkKVTFcyfPProf0GvSi9C-L22hUsZ_NA-03wXjd2F-GRIS/exec";
var TOKEN = new URLSearchParams(location.search).get("t") || "";
var wrap = document.getElementById("wrap"), STAR = 0, PILIH = "";
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function rp(n){ return "RM " + (Number(n)||0).toFixed(2); }
function splash(h){ wrap.innerHTML = '<div class="splash">' + h + '</div>'; }
function post(p){ p.token = TOKEN; return fetch(API, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(p) }).then(function(r){ return r.json(); }); }
function msg(id, html){ var e = document.getElementById(id); if (e) e.innerHTML = html; }

function render(d){
  if (!d.ok) { splash("⚠️ " + esc(d.error || "Pautan tidak sah atau sudah tamat.") + "<br><br>Sila hubungi Mr Tanah: WhatsApp 016-3119076"); return; }
  var t = d.tiket, h = "";
  h += '<div class="card"><h2>📋 Aduan Anda — ' + esc(t.ref) + '</h2><div class="meta">' +
       '<b>Unit:</b> ' + esc(t.unit) + '<br><b>Kerosakan:</b> ' + esc(t.jenis) + '<br><b>Keterangan:</b> ' + esc(t.keterangan).replace(/\n/g, "<br>") +
       '<br><b>Status:</b> <span class="st ' + (t.status === "SELESAI" ? "s-ok" : "s-claim") + '">' + esc(t.status) + '</span>' +
       (t.folder ? '<br><a href="' + esc(t.folder) + '" target="_blank" style="color:#123a7a">📁 Gambar / dokumen tiket</a>' : '') + '</div></div>';

  if (d.sebutharga && d.sebutharga.length) {
    var adaDipilih = d.sebutharga.some(function(s){ return s.status === "DIPILIH"; });
    h += '<div class="card"><h2>📊 Perbandingan Sebut Harga</h2><table><tr><th>Kontraktor</th><th class="num">Jumlah</th><th>Tempoh</th><th>Waranti</th><th>Status</th></tr>';
    d.sebutharga.forEach(function(s){
      h += '<tr id="row_' + esc(s.ref_sh) + '"><td>' + esc(s.kontraktor) + '</td><td class="num">' + rp(s.jumlah) + '</td><td>' +
        esc(s.tempoh) + ' hari</td><td>' + esc(s.waranti) + ' bln</td><td><span class="st ' + (s.status === "DIPILIH" ? "s-ok" : (s.status === "TIDAK DIPILIH" ? "s-bad" : "s-wait")) + '">' + esc(s.status) + '</span></td></tr>';
    });
    h += '</table>';
    if (!adaDipilih) {
      h += '<label>Pilih sebut harga</label><select id="selSH"><option value="">— Pilih —</option>';
      d.sebutharga.forEach(function(s){ if (s.status !== "TIDAK DIPILIH") h += '<option value="' + esc(s.ref_sh) + '">' + esc(s.kontraktor) + ' — ' + rp(s.jumlah) + '</option>'; });
      h += '</select><button class="btn" id="btnLulus">✅ Luluskan Sebut Harga Ini</button>' +
           '<button class="btn ghost" id="btnTolak">⚠️ Tolak Semua / Minta Semak Semula</button>' +
           '<div id="mPilih"></div><div class="hint">Pemilik hanya membayar jumlah sebut harga yang diluluskan — tiada caj tambahan.</div>';
    } else {
      h += '<div class="ok">✅ Anda telah meluluskan sebut harga. Mr Tanah akan keluarkan Work Order kepada kontraktor.</div>';
    }
    h += '</div>';
  }

  if (d.wo) {
    h += '<div class="card"><h2>📄 Kerja &amp; Bayaran <span class="st ' + (d.wo.status === "SELESAI" ? "s-ok" : "s-claim") + '">' + esc(d.wo.status) + '</span></h2>' +
      '<div class="meta"><b>No WO:</b> ' + esc(d.wo.no_wo) + ' · <b>Kontraktor:</b> ' + esc(d.wo.kontraktor) +
      '<br><b>Jumlah kontrak:</b> ' + rp(d.wo.jumlah) + ' · <b>Siap sasaran:</b> ' + esc(d.wo.tarikh_siap) + '</div>';
    if (d.tahap && d.tahap.length) {
      h += '<table style="margin-top:10px"><tr><th>Tahap</th><th>Perkara</th><th class="num">Jumlah</th><th>Status</th></tr>';
      d.tahap.forEach(function(s){
        h += '<tr><td>' + esc(s.tahap) + '</td><td>' + esc(s.perkara) + '</td><td class="num">' + rp(s.bayaran_pemilik) +
          '</td><td><span class="st ' + (s.status === "DIBAYAR" ? "s-ok" : (s.status === "TUNTUTAN" ? "s-claim" : "s-wait")) + '">' + esc(s.status) + '</span></td></tr>';
      });
      h += '</table><div class="hint">Bayaran mengikut tahap. Cara bayar: pautan Billplz yang dihantar Mr Tanah, ATAU pindahan bank + emel bukti ke mrtanahmy@gmail.com (nyatakan No. Rujukan/WO).</div>';
    }
    if (d.wo.qc === "LULUS" && !d.wo.terimaan) {
      h += '<div class="ok">✅ Kerja telah dilaporkan siap oleh kontraktor dan <b>lulus QC Mr Tanah</b>. Sila sahkan terimaan.</div>' +
           '<label>Nota (jika ada)</label><textarea id="notaTerima" placeholder="cth. Ada sedikit cat tertinggal — minta bersihkan."></textarea>' +
           '<button class="btn" id="btnTerima">👍 Saya TERIMA Kerja Ini</button><div id="mTerima"></div>';
    } else if (d.wo.terimaan && !d.wo.review) {
      h += '<div class="ok">✅ Terimaan anda direkod pada ' + esc(d.wo.terimaan) + '. Sila beri penilaian.</div>' +
           '<div class="stars" id="stars"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div>' +
           '<label>Komen</label><textarea id="komenRev"></textarea>' +
           '<button class="btn ghost" id="btnReview">📩 Hantar Penilaian</button><div id="mRev"></div>';
    } else if (d.wo.review) {
      h += '<div class="ok">🙏 Terima kasih — penilaian anda (' + esc(d.wo.review) + '★) sudah direkod. Kerja ini selesai.</div>';
    }
    h += '</div>';
  }
  wrap.innerHTML = h; bind();
}

function bind(){
  var b1 = document.getElementById("btnLulus");
  if (b1) b1.onclick = function(){
    var ref = document.getElementById("selSH").value;
    if (!ref) { msg("mPilih", '<div class="err">Sila pilih satu sebut harga dahulu.</div>'); return; }
    if (!confirm("Luluskan sebut harga ini?")) return;
    b1.disabled = true; b1.textContent = "Menghantar…";
    post({ form:"lulus", ref_sh:ref }).then(function(r){
      msg("mPilih", r.ok ? '<div class="ok">✅ Diluluskan — ' + rp(r.jumlah) + '. Mr Tanah akan meneruskan kerja.</div>' : '<div class="err">❌ ' + esc(r.error) + '</div>');
      if (r.ok) setTimeout(function(){ location.reload(); }, 1500);
      else { b1.disabled = false; b1.textContent = "✅ Luluskan Sebut Harga Ini"; }
    }).catch(function(){ b1.disabled = false; b1.textContent = "✅ Luluskan Sebut Harga Ini"; msg("mPilih", '<div class="err">Ralat rangkaian.</div>'); });
  };
  var b2 = document.getElementById("btnTolak");
  if (b2) b2.onclick = function(){
    var sebab = prompt("Sebab tolak / semak semula (penyewa, pemilik, harga, dsb):");
    if (sebab === null) return;
    b2.disabled = true;
    post({ form:"tolak", ref_sh: (document.getElementById("selSH").value || ""), sebab: sebab }).then(function(r){
      msg("mPilih", r.ok ? '<div class="ok">Direkod. Mr Tanah akan hubungi anda.</div>' : '<div class="err">❌ ' + esc(r.error) + '</div>');
      b2.disabled = false;
    });
  };
  var b3 = document.getElementById("btnTerima");
  if (b3) b3.onclick = function(){
    if (!confirm("Sahkan anda TERIMA kerja ini?")) return;
    b3.disabled = true; b3.textContent = "Menghantar…";
    post({ form:"terima", no_wo: (window.__WO || ""), nota: (document.getElementById("notaTerima")||{}).value || "" })
    .then(function(r){ msg("mTerima", r.ok ? '<div class="ok">✅ Terimaan direkod. Terima kasih.</div>' : '<div class="err">❌ ' + esc(r.error) + '</div>'); if (r.ok) setTimeout(function(){ location.reload(); }, 1200); });
  };
  var st = document.getElementById("stars");
  if (st) {
    [].forEach.call(st.querySelectorAll("span"), function(sp, i){
      sp.onclick = function(){ STAR = i + 1; var s = ""; for (var k = 0; k < 5; k++) s += (k < STAR ? "<b>★</b>" : "<span>★</span>"); st.innerHTML = s; };
    });
  }
  var b4 = document.getElementById("btnReview");
  if (b4) b4.onclick = function(){
    if (!STAR) { msg("mRev", '<div class="err">Pilih bintang dahulu.</div>'); return; }
    b4.disabled = true;
    post({ form:"review", no_wo:(window.__WO||""), bintang:STAR, komen:(document.getElementById("komenRev")||{}).value || "" })
    .then(function(r){ msg("mRev", r.ok ? '<div class="ok">✅ Terima kasih! Penilaian ' + r.bintang + '★ direkod.</div>' : '<div class="err">❌ ' + esc(r.error) + '</div>'); if (r.ok) setTimeout(function(){ location.reload(); }, 1400); });
  };
}

if (!TOKEN) splash("⚠️ Pautan tidak lengkap (tiada token). Guna pautan yang dihantar Mr Tanah.");
else fetch(API + "?aksi=pemilik&token=" + encodeURIComponent(TOKEN))
  .then(function(r){ return r.json(); })
  .then(function(d){ window.__WO = (d.wo ? d.wo.no_wo : ""); render(d); })
  .catch(function(){ splash("Ralat memuatkan data. Sila muat semula halaman."); });
</script>
</body>
</html>
