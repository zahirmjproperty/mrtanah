<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Buyer Dashboard — Zentra Portal</title>
<style>
  :root { --mt:#123a7a; --mt-tua:#0a1f44; --hijau:#14905c; --oren:#e8862e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; background:#f2f6f4; color:#1d2b24; line-height:1.5; }
  .topbar { background:linear-gradient(135deg,#0a1f44 0%,#14905c 55%,#123a7a 100%); color:#fff; padding:16px; }
  .topbar h1 { font-size:18px; } .topbar p { font-size:12.5px; opacity:.92; margin-top:2px; }
  .wrap { max-width:680px; margin:0 auto; padding:14px 14px 48px; }
  .card { background:#fff; border-radius:14px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:13px; }
  .card h2 { font-size:14.5px; color:var(--mt-tua); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .meta { background:#f6faf8; border:1px solid #e0eae3; border-radius:11px; padding:11px 12px; font-size:12.7px; }
  .row { display:flex; justify-content:space-between; gap:10px; padding:3px 0; border-bottom:1px dashed #e6efe9; }
  .row:last-child { border:0; } .row span { color:#5a6b61; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th { background:#eef3f7; color:var(--mt-tua); text-align:left; padding:7px 5px; font-size:10.5px; }
  td { padding:9px 5px; border-top:1px solid #e9f0ec; vertical-align:top; }
  .num { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .btn { padding:12px 14px; background:var(--hijau); color:#fff; border:0; border-radius:10px; font-size:13.5px; font-weight:700; cursor:pointer; text-decoration:none; display:inline-block; text-align:center; }
  .btn.sec { background:var(--mt); } .btn.ghost { background:#eef3f7; color:var(--mt-tua); }
  .btnrow { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .btnrow .btn { flex:1; min-width:140px; }
  .kpi { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .kbox { background:#fff; border:1px solid #e4ecf1; border-radius:12px; padding:11px 12px; }
  .kbox .l { font-size:10.5px; color:#5a6b61; text-transform:uppercase; letter-spacing:.3px; }
  .kbox .v { font-size:18px; font-weight:800; color:var(--mt-tua); font-variant-numeric:tabular-nums; margin-top:3px; }
  .kbox .s { font-size:10.5px; color:#7c8b93; }
  .amr { border-left:4px solid #cfdcd4; background:#f8fbf9; border-radius:9px; padding:10px 11px; margin-bottom:9px; font-size:12.6px; }
  .amr.merah { border-color:#d64545; background:#fdf3f3; } .amr.kuning { border-color:#e8a33d; background:#fdf8f0; }
  .amr.biru { border-color:#3f6fd6; background:#f3f6fd; } .amr.hijau { border-color:#33a06a; background:#f2faf5; }
  .amr b { color:var(--mt-tua); display:block; } .amr i { font-style:normal; color:#5a6b61; font-size:11.7px; }
  .st { font-size:10px; font-weight:800; border-radius:20px; padding:2px 8px; display:inline-block; white-space:nowrap; }
  .s-wait { background:#eef3f7; color:#5a6b61; } .s-ok { background:#e5f4ec; color:#0e5a33; }
  .s-warn { background:#fdf1e3; color:#8a5308; } .s-info { background:#e8eefb; color:#1c3f8f; } .s-bad { background:#fdeaea; color:#a11; }
  .step { display:flex; align-items:flex-start; gap:9px; padding:6px 0; }
  .dot { width:20px; height:20px; border-radius:50%; background:#e4ecf1; color:#5a6b61; font-size:10.5px; font-weight:800; display:flex; align-items:center; justify-content:center; flex:0 0 20px; margin-top:1px; }
  .dot.on { background:var(--hijau); color:#fff; } .dot.past { background:#cfe6da; color:#0e5a33; }
  .step .t { font-size:12.5px; font-weight:700; color:var(--mt-tua); }
  .step .d { font-size:11px; color:#6a7a71; }
  .hint { font-size:11.5px; color:#5a6b61; margin-top:6px; }
  .foot { text-align:center; font-size:11px; color:#6a7a71; margin-top:16px; }
  .splash { text-align:center; padding:40px 16px; color:#5a6b61; font-size:14px; }
  .badge { font-size:10.5px; font-weight:800; background:#e8f5ee; color:#0e5a33; border-radius:20px; padding:3px 9px; }
  .pban { max-width:680px; margin:12px auto 0; padding:9px 12px; background:#fff6e5; border:1px solid #f0d9a8; border-radius:10px; font-size:12px; color:#8a5308; }
  .note { background:#f6faf8; border:1px solid #e0eae3; border-radius:11px; padding:11px; font-size:12.3px; }
</style>
</head>
<body>
  <div class="topbar">
    <h1>👤 Buyer Dashboard</h1>
    <p id="sub">Mr Tanah · ZMJ Solutions — your transaction stages, documents &amp; payments</p>
  </div>
  <div id="navPhmt" style="max-width:900px;margin:14px auto 0;padding:0 14px"></div>
  <div class="wrap" id="wrap"><div class="splash">Loading…</div></div>
  <div class="foot">Private document — this link/account is exclusively yours. Do not share.</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/auth-config.js?v=2"></script>
<script src="assets/auth-nav.js?v=9"></script>
<script>
var API = "https://script.google.com/macros/s/AKfycbwafaViIuCpc-Q0XnUpSHgkKVTFcyfPProf0GvSi9C-L22hUsZ_NA-03wXjd2F-GRIS/exec";
var TOKEN = new URLSearchParams(location.search).get("t") || "";
var MOD = "token", SESI = null, SB = null, D = null, SIBUK = false;
function rm(n){ return "RM " + Number(n||0).toLocaleString("ms-MY", {minimumFractionDigits:2, maximumFractionDigits:2}); }
function rm0(n){ return "RM " + Number(n||0).toLocaleString("ms-MY", {maximumFractionDigits:0}); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function tkh(s){ if(!s) return "—"; var d=String(s).substring(0,10).split("-"); return d.length===3 ? d[2]+"/"+d[1]+"/"+d[0] : String(s); }
function splash(m){ document.getElementById("wrap").innerHTML = '<div class="splash">'+m+'</div>'; }
function hariTeks(h){ if(h===null||h===undefined) return ""; if(h<0) return Math.abs(h)+" days overdue"; if(h===0) return "TODAY"; return "in "+h+" days"; }
function stDok(s){ s=String(s||"").toUpperCase();
  if(s==="OK") return '<span class="st s-ok">COMPLETED</span>';
  if(s==="MENUNGGU") return '<span class="st s-warn">PENDING</span>';
  if(s.indexOf("TIDAK")>=0) return '<span class="st s-wait">N/A</span>';
  return '<span class="st s-wait">'+esc(s||"—")+'</span>'; }
function wa(nombor, teks){ var n=String(nombor||"").replace(/[^0-9]/g,""); if(n.indexOf("0")===0) n="6"+n; else if(n.indexOf("60")!==0) n="6"+n; return "https://wa.me/"+n+"?text="+encodeURIComponent(teks||""); }

function urlAPI() {
  return (MOD === "login")
    ? API + "?aksi=pembeli-dash&access_token=" + encodeURIComponent((SESI && SESI.access_token) || "") + "&_=" + Date.now()
    : API + "?aksi=pembeli-dash&token=" + encodeURIComponent(TOKEN) + "&_=" + Date.now();
}
function muat() {
  if (SIBUK) return; SIBUK = true;
  var p = (window.PRATONTON_DATA) ? Promise.resolve(window.PRATONTON_DATA) : fetch(urlAPI()).then(function(r){ return r.json(); });
  if (!D) splash("Loading…");
  p.then(function(d){
    SIBUK = false;
    if (!d || !d.ok) {
      if (MOD === "login" && /sesi tidak sah|tamat tempoh/i.test(String((d||{}).error||""))) { location.href = "login.html"; return; }
      splash("⚠️ " + esc((d||{}).error || "Invalid or expired link."));
      return;
    }
    D = d; lukis();
    var nav = document.getElementById("navPhmt");
    if (nav && window.PHMT && D.peranans) PHMT.lukis(nav, D.peranans, "PEMBELI_HARTANAH");
  })
  .catch(function(e){ SIBUK = false; splash("⚠️ Failed to load data.<br><small>"+esc(e)+"</small>"); });
}
(function init(){
  var A = window.AUTH || {};
  if (window.PRATONTON_DATA) { muat(); return; }
  if (!A.url || !A.key || typeof window.supabase === "undefined") {
    if (TOKEN) muat(); else splash("⚠️ Incomplete link (no token). Use the link sent by Mr Tanah, or sign in.");
    return;
  }
  SB = window.supabase.createClient(A.url, A.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  SB.auth.getSession().then(function(o){
    SESI = (o.data && o.data.session) || null;
    if (SESI) { MOD = "login"; muat(); return; }
    if (TOKEN) { MOD = "token"; muat(); return; }
    location.href = "login.html";
  });
})();

function garisPeringkat(k){
  var susun = D.susun || ["TAWARAN","TEMPAHAN","PINJAMAN","SPA","PINDAH HAK","SELESAI"];
  var idx = susun.indexOf(k.peringkat), h = "";
  susun.forEach(function(p, i){
    var tp = (k.tarikh_peringkat || {})[p] || "";
    var cls = (i === idx) ? "on" : (i < idx ? "past" : "");
    h += '<div class="step"><div class="dot ' + cls + '">' + (i + 1) + '</div><div><div class="t">' + esc(p) + (i === idx ? " ← current" : "") + '</div>'
      + (tp ? '<div class="d">' + tkh(tp) + '</div>' : '<div class="d">—</div>') + '</div></div>';
  });
  return h;
}

function lukis(){
  var kp = D.kpi || {}, h = "";
  document.getElementById("sub").textContent = "Mr Tanah · " + (D.pembeli || "") + (kp.kes_jumlah ? " · " + kp.kes_jumlah + " cases" : "");
  var logKeluar = (MOD === "login") ? '<div class="btnrow"><button class="btn ghost" onclick="keluar()">Sign out</button></div>' : "";

  h += '<div class="card"><h2>📌 Transaction Summary <span class="badge">ACTUAL DATA</span></h2><div class="kpi">'
    +  '<div class="kbox"><div class="l">Active cases</div><div class="v">' + (kp.kes_aktif||0) + '</div><div class="s">' + (kp.kes_selesai||0) + ' completed · stage ' + esc(kp.peringkat_semasa||"—") + '</div></div>'
    +  '<div class="kbox"><div class="l">Case value</div><div class="v">' + rm0(kp.nilai) + '</div><div class="s">' + (kp.kes_jumlah||0) + ' cases recorded</div></div>'
    +  '<div class="kbox"><div class="l">Deposit paid</div><div class="v">' + rm0(kp.deposit) + '</div><div class="s">recorded by MT</div></div>'
    +  '<div class="kbox"><div class="l">Balance to completion</div><div class="v">' + rm0(kp.baki) + '</div><div class="s">price − deposit</div></div>'
    +  '</div><div class="btnrow"><button class="btn ghost" onclick="muat()">🔄 Pull latest data</button></div>'
    +  '<div class="hint">Data as of <b>' + esc(D.masa||"") + '</b> — updated by the Mr Tanah office.</div>' + logKeluar + '</div>';

  h += '<div class="card"><h2>⏰ Needs attention</h2>';
  (D.amaran||[]).forEach(function(a){ h += '<div class="amr ' + esc(a.tahap) + '"><b>' + esc(a.tajuk) + '</b><i>' + esc(a.butir) + '</i></div>'; });
  if ((D.tindakan||[]).length) {
    h += '<div style="margin-top:10px"><b style="font-size:12.5px;color:#0a1f44">Actions in the system record</b>';
    D.tindakan.forEach(function(t){ h += '<div class="amr kuning" style="margin-top:8px"><b>' + esc(t.perkara) + '</b><i>' + esc(t.kes) + ' · ' + esc(t.butir) + '</i></div>'; });
    h += '</div>';
  }
  h += '</div>';

  if (!(D.kes||[]).length) {
    h += '<div class="card"><div class="hint">No transaction cases are registered under your name at the moment. If this is not correct, contact Mr Tanah.</div></div>';
  }

  (D.kes||[]).forEach(function(k){
    h += '<div class="card"><h2>' + esc(k.kes) + ' <span class="badge">' + esc(k.jenis) + '</span></h2>'
      +  '<div class="meta"><div class="row"><span>Property</span><b>' + esc(k.hartanah) + '</b></div>'
      +  '<div class="row"><span>Address</span><b>' + esc(k.alamat||"—") + '</b></div>'
      +  '<div class="row"><span>Price</span><b>' + rm(k.harga) + '</b></div>'
      +  '<div class="row"><span>Deposit recorded</span><b>' + rm(k.deposit) + '</b></div>'
      +  '<div class="row"><span>Balance (price − deposit)</span><b>' + rm(k.baki) + '</b></div>'
      +  (Number(k.pinjaman_diluluskan) > 0 ? '<div class="row"><span>Financing approved</span><b>' + rm(k.pinjaman_diluluskan) + ' · ' + esc(k.bank||"—") + '</b></div>'
            + '<div class="row"><span>LO date / rate</span><b>' + tkh(k.tarikh_lo) + ' · ' + esc(k.kadar||"—") + '</b></div>' : '')
      +  '<div class="row"><span>Status</span><b>' + esc(k.status) + '</b></div>'
      +  (k.tarikh_penting ? '<div class="row"><span>Key date</span><b>' + tkh(k.tarikh_penting) + ' (' + esc(hariTeks(k.hari_penting)) + ')</b></div>' : '')
      +  '</div>'
      +  '<h2 style="margin-top:12px">🧭 Stages</h2>' + garisPeringkat(k)
      +  (k.panduan ? '<div class="note" style="margin-top:8px"><b>Next step:</b> ' + esc(k.panduan) + '</div>' : '');

    if ((k.dokumen||[]).length) {
      h += '<h2 style="margin-top:12px">📄 Documents</h2><table><tr><th>Document</th><th>Status</th></tr>';
      k.dokumen.forEach(function(dd){ h += '<tr><td>' + esc(dd.nama) + '</td><td>' + stDok(dd.status) + '</td></tr>'; });
      h += '</table><div class="hint">Status is maintained by the MT office. Documents are delivered via WhatsApp or email — not downloaded from the portal.</div>';
    }

    h += '<h2 style="margin-top:12px">👥 Related parties</h2><div class="meta">'
      +  '<div class="row"><span>Agent</span><b>' + esc(k.ejen||"—") + (k.ejen_agensi ? " · " + esc(k.ejen_agensi) : "") + '</b></div>'
      +  (k.ejen_telefon ? '<div class="row"><span>Agent phone</span><b>' + esc(k.ejen_telefon) + '</b></div>' : '')
      +  '<div class="row"><span>Your solicitor</span><b>' + esc(k.solicitor_saya||"Not yet appointed") + '</b></div>'
      +  '<div class="row"><span>Mortgage officer</span><b>' + esc(k.mortgage||"—") + '</b></div>'
      +  '<div class="row"><span>Seller</span><b>' + esc(k.lawan_nama||k.penjual||"—") + '</b></div>'
      +  '</div><div class="btnrow">';
    if (k.ejen_telefon) h += '<a class="btn ghost" href="' + esc(wa(k.ejen_telefon, "Hello " + (k.ejen||"") + ", I am the buyer for case " + k.kes + " (" + k.hartanah + "). May I ask for an update?")) + '" target="_blank">WhatsApp agent</a>';
    h += '<a class="btn ghost" href="https://wa.me/60163119076?text=' + encodeURIComponent("Buyer " + (D.pembeli||"") + " — case " + k.kes + " (" + k.hartanah + "): ") + '" target="_blank">WhatsApp MT</a></div>'
      +  '<div class="hint">Last record update: ' + esc(k.dikemaskini||"—") + '</div></div>';
    h += '</div>';
  });

  h += '<div class="card"><h2>💬 Contact Mr Tanah</h2><div class="btnrow">'
    +  '<a class="btn" href="https://wa.me/60163119076?text=' + encodeURIComponent("Buyer " + (D.pembeli||"") + " — ") + '" target="_blank">WhatsApp MT 016-311 9076</a>'
    +  '<a class="btn ghost" href="mailto:mrtanahmy@gmail.com" target="_blank">Email MT</a></div>'
    +  '<div class="note" style="margin-top:10px">' + esc(D.nota||"") + '</div>'
    +  '<div class="hint">Office hours Monday–Friday 9:00 am–6:00 pm.</div></div>';

  document.getElementById("wrap").innerHTML = h;
  window.scrollTo(0,0);
}
function keluar(){ if (SB) SB.auth.signOut().then(function(){ location.href = "login.html"; }); else location.href = "login.html"; }
</script>
</body>
</html>
