<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Dashboard Kontraktor — Mr Tanah</title>
<style>
  :root { --mt:#123a7a; --mt-tua:#0a1f44; --hijau:#14905c; --oren:#e8862e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; background:#f2f6f4; color:#1d2b24; line-height:1.5; }
  .topbar { background:linear-gradient(135deg,#7a4a12 0%,#123a7a 60%,#14905c 100%); color:#fff; padding:16px; }
  .topbar h1 { font-size:18px; } .topbar p { font-size:12.5px; opacity:.92; margin-top:2px; }
  .wrap { max-width:680px; margin:0 auto; padding:14px 14px 48px; }
  .card { background:#fff; border-radius:14px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:13px; }
  .card h2 { font-size:14.5px; color:var(--mt-tua); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .meta { background:#f6faf8; border:1px solid #e0eae3; border-radius:11px; padding:11px 12px; font-size:12.7px; }
  .row { display:flex; justify-content:space-between; gap:10px; padding:3px 0; border-bottom:1px dashed #e6efe9; }
  .row:last-child { border:0; }
  .row span { color:#5a6b61; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th { background:#eef3f7; color:var(--mt-tua); text-align:left; padding:7px 5px; font-size:10.5px; }
  td { padding:9px 5px; border-top:1px solid #e9f0ec; vertical-align:top; }
  .num { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .btn { width:100%; padding:14px; background:var(--hijau); color:#fff; border:0; border-radius:11px; font-size:15px; font-weight:700; cursor:pointer; }
  .btn.sec { background:var(--mt); } .btn.ghost { background:#eef3f7; color:var(--mt-tua); }
  .btn:disabled { opacity:.55; cursor:not-allowed; }
  .btnrow { display:flex; gap:9px; flex-wrap:wrap; margin-top:12px; }
  .btnrow .btn { width:auto; flex:1; min-width:130px; }
  .ok { background:#e5f4ec; border:1px solid #bfe3cf; color:#0e5a33; border-radius:11px; padding:12px; font-size:13px; }
  .err { background:#fdeaea; border:1px solid #f2c2c2; color:#8c1f1f; border-radius:11px; padding:12px; font-size:13px; }
  .st { font-size:10px; font-weight:800; border-radius:20px; padding:2px 8px; display:inline-block; white-space:nowrap; }
  .s-wait { background:#eef3f7; color:#5a6b61; } .s-bad { background:#fdeaea; color:#a11; }
  .s-ok { background:#e5f4ec; color:#0e5a33; } .s-warn { background:#fdf1e3; color:#8a5308; } .s-info { background:#e8eefb; color:#1c3f8f; }
  .kpi { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .kbox { background:#fff; border:1px solid #e4ecf1; border-radius:12px; padding:11px 12px; }
  .kbox .l { font-size:10.5px; color:#5a6b61; text-transform:uppercase; letter-spacing:.3px; }
  .kbox .v { font-size:19px; font-weight:800; color:var(--mt-tua); font-variant-numeric:tabular-nums; margin-top:3px; }
  .kbox .s { font-size:10.5px; color:#7c8b93; }
  .amr { border-left:4px solid #cfdcd4; background:#f8fbf9; border-radius:9px; padding:10px 11px; margin-bottom:9px; font-size:12.6px; }
  .amr.merah { border-color:#d64545; background:#fdf3f3; }
  .amr.kuning { border-color:#e8a33d; background:#fdf8f0; }
  .amr.biru { border-color:#3f6fd6; background:#f3f6fd; }
  .amr.hijau { border-color:#33a06a; background:#f2faf5; }
  .amr b { color:var(--mt-tua); display:block; }
  .amr i { font-style:normal; color:#5a6b61; font-size:11.7px; }
  label { display:block; font-size:12.5px; font-weight:600; margin:11px 0 4px; }
  input { width:100%; padding:11px 12px; border:1.5px solid #cfdcd4; border-radius:10px; font-size:15px; background:#fbfdfc; font-family:inherit; }
  .hint { font-size:11.5px; color:#5a6b61; margin-top:6px; }
  .foot { text-align:center; font-size:11px; color:#6a7a71; margin-top:16px; }
  .splash { text-align:center; padding:40px 16px; color:#5a6b61; font-size:14px; }
  .badge { font-size:10.5px; font-weight:800; background:#e8f5ee; color:#0e5a33; border-radius:20px; padding:3px 9px; }
  .pban { max-width:680px; margin:12px auto 0; padding:9px 12px; background:#fff6e5; border:1px solid #f0d9a8; border-radius:10px; font-size:12px; color:#8a5308; }
  .star { color:#e8a33d; }
</style>
</head>
<body>
  <div class="topbar">
    <h1>🔧 Dashboard Kontraktor</h1>
    <p id="sub">Mr Tanah · ZMJ Solutions — sebutharga, kerja &amp; tuntutan anda</p>
  </div>
  <div id="navPhmt" style="max-width:900px;margin:14px auto 0;padding:0 14px"></div>
  <div class="wrap" id="wrap">
    <div class="splash">Memuatkan…</div>
  </div>
  <div class="foot">Dokumen peribadi — pautan/akaun ini khas untuk panel kontraktor anda. Jangan kongsi.</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/auth-config.js?v=2"></script>
<script src="assets/auth-nav.js?v=6"></script>
<script>
var API = "https://script.google.com/macros/s/AKfycbwafaViIuCpc-Q0XnUpSHgkKVTFcyfPProf0GvSi9C-L22hUsZ_NA-03wXjd2F-GRIS/exec";
var TOKEN = new URLSearchParams(location.search).get("t") || "";
var MOD = "token";   /* "token" = pautan panel · "login" = sesi log masuk (Supabase) */
var SESI = null, SB = null, D = null, SIBUK = false;
function rm(n){ return "RM " + Number(n||0).toLocaleString("ms-MY", {minimumFractionDigits:2, maximumFractionDigits:2}); }
function rm0(n){ return "RM " + Number(n||0).toLocaleString("ms-MY", {maximumFractionDigits:0}); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function tkh(s){ if(!s) return "—"; var d=String(s).substring(0,10).split("-"); return d.length===3 ? d[2]+"/"+d[1]+"/"+d[0] : String(s); }
function splash(m){ document.getElementById("wrap").innerHTML = '<div class="splash">'+m+'</div>'; }
function badge(s){ s=String(s||"").toUpperCase(); return '<span class="st s-wait">'+esc(s||"—")+'</span>'; }
function stRfq(s){ s=String(s||"").toUpperCase();
  if(s.indexOf("DIMINTA")>=0) return '<span class="st s-bad">PERLU ANDA HANTAR</span>';
  if(s==="DIPILIH") return '<span class="st s-ok">DIPILIH MT</span>';
  if(s==="DITERIMA") return '<span class="st s-warn">DIHANTAR</span>';
  return '<span class="st s-wait">'+esc(s||"—")+'</span>'; }
function stWo(s){ s=String(s||"").toUpperCase();
  if(s.indexOf("SELESAI")>=0) return '<span class="st s-ok">SELESAI</span>';
  if(s.indexOf("QC GAGAL")>=0) return '<span class="st s-bad">QC GAGAL</span>';
  if(s.indexOf("QC LULUS")>=0) return '<span class="st s-ok">QC LULUS</span>';
  if(s.indexOf("SIAP")>=0) return '<span class="st s-warn">SIAP — MENUNGGU QC</span>';
  if(s.indexOf("KERJA")>=0||s.indexOf("DIKELUARKAN")>=0) return '<span class="st s-info">'+esc(s)+'</span>';
  return badge(s); }
function stTuntutan(s){ s=String(s||"").toUpperCase();
  if(s.indexOf("DIBAYAR")>=0) return '<span class="st s-ok">DIBAYAR</span>';
  if(s==="TUNTUTAN") return '<span class="st s-warn">TUNTUTAN — MENUNGGU MT</span>';
  if(s==="DISAHKAN") return '<span class="st s-info">DISAHKAN MT</span>';
  return '<span class="st s-wait">BELUM DITUNTUT</span>'; }
function hariTeks(h){ if(h===null||h===undefined) return ""; if(h<0) return " · lewat "+Math.abs(h)+" hari"; if(h===0) return " · hari ini"; return " · "+h+" hari lagi"; }

function urlAPI() {
  return (MOD === "login")
    ? API + "?aksi=kontraktor-dash&access_token=" + encodeURIComponent((SESI && SESI.access_token) || "") + "&_=" + Date.now()
    : API + "?aksi=kontraktor-dash&token=" + encodeURIComponent(TOKEN) + "&_=" + Date.now();
}
function muat(paksa) {
  if (SIBUK) return; SIBUK = true;
  var p = (window.PRATONTON_DATA) ? Promise.resolve(window.PRATONTON_DATA) : fetch(urlAPI()).then(function(r){ return r.json(); });
  if (!window.PRATONTON_DATA && paksa) splash("Menghubungi pelayan… (boleh ambil beberapa saat)");
  else if (!D) splash("Memuatkan…");
  p.then(function(d){
    SIBUK = false;
    if (!d || !d.ok) {
      if (MOD === "login" && /sesi tidak sah|tamat tempoh/i.test(String((d||{}).error||""))) { location.href = "login.html"; return; }
      if (D) { document.getElementById("wrap").insertAdjacentHTML("afterbegin", '<div class="err">⚠️ Gagal memuatkan data terkini — paparan lama dikekalkan.<br><small>'+esc((d||{}).error||"Ralat rangkaian")+'</small></div>'); }
      else splash("⚠️ " + esc((d||{}).error || "Pautan tidak sah atau telah dimatikan."));
      return;
    }
    D = d; lukis();
    var nav = document.getElementById("navPhmt");
    if (nav && window.PHMT && D.peranans) PHMT.lukis(nav, D.peranans, "KONTRAKTOR");
  })
  .catch(function(e){ SIBUK = false; if (D) { document.getElementById("wrap").insertAdjacentHTML("afterbegin", '<div class="err">⚠️ Ralat rangkaian — paparan lama dikekalkan.</div>'); } else splash("⚠️ Gagal memuatkan data.<br><small>"+esc(e)+"</small>"); });
}
(function init(){
  var A = window.AUTH || {};
  if (window.PRATONTON_DATA) { muat(); return; }                 /* mod pratonton: data disuntik */
  if (!A.url || !A.key || typeof window.supabase === "undefined") {
    if (TOKEN) muat(); else splash("⚠️ Pautan tidak lengkap (tiada token). Guna pautan panel dari Mr Tanah, atau log masuk.");
    return;
  }
  SB = window.supabase.createClient(A.url, A.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  SB.auth.getSession().then(function(o){
    SESI = (o.data && o.data.session) || null;
    if (SESI) { MOD = "login"; muat(); return; }
    if (TOKEN) { MOD = "token"; muat(); return; }
    location.href = "login.html";
  });
})();

function lukis(){
  var k = D.kontraktor || {}, kp = D.kpi || {}, h = "";
  document.getElementById("sub").textContent = "Mr Tanah · " + (k.nama || "") + (k.id ? " (" + k.id + ")" : "") + (k.kepakaran ? " · " + k.kepakaran : "");
  var masa = esc(D.masa || "");
  var logKeluar = (MOD === "login") ? '<div class="btnrow"><button class="btn ghost" onclick="keluar()">Log keluar</button></div>' : "";

  /* ---- KPI ---- */
  h += '<div class="card"><h2>📌 Ringkasan <span class="badge" title="Data ' + masa + '">DATA SEBENAR</span></h2><div class="kpi">'
    +  '<div class="kbox"><div class="l">Kerja aktif</div><div class="v">' + (kp.wo_aktif||0) + '</div><div class="s">' + (kp.wo_selesai||0) + ' kerja selesai</div></div>'
    +  '<div class="kbox"><div class="l">Nilai kontrak berjalan</div><div class="v">' + rm0(kp.nilai_aktif) + '</div><div class="s">jumlah semua: ' + rm0(kp.nilai_semua) + '</div></div>'
    +  '<div class="kbox"><div class="l">Sebut harga perlu dihantar</div><div class="v">' + (kp.rfq_menunggu||0) + '</div><div class="s">' + (kp.rfq_dihantar||0) + ' sudah dihantar</div></div>'
    +  '<div class="kbox"><div class="l">Tuntutan dalam proses</div><div class="v">' + rm0(kp.tuntutan_proses) + '</div><div class="s">' + (kp.tuntutan_bil||0) + ' tuntutan · dibayar ' + rm0(kp.dibayar) + '</div></div>'
    +  '</div><div class="btnrow"><button class="btn ghost" onclick="muat(1)">🔄 Tarik data terkini</button></div>'
    +  '<div class="hint">Data setakat <b>' + masa + '</b> (waktu Malaysia). Butang di atas memaksa baca terus dari sistem MT.</div>'
    +  logKeluar + '</div>';

  /* ---- tindakan ---- */
  h += '<div class="card"><h2>⚡ Perlu tindakan</h2>';
  (D.amaran || []).forEach(function(a){ h += '<div class="amr ' + esc(a.tahap) + '"><b>' + esc(a.tajuk) + '</b><i>' + esc(a.butir) + '</i></div>'; });
  h += '</div>';

  /* ---- profil ---- */
  h += '<div class="card"><h2>🧰 Profil Panel</h2><div class="meta">'
    +  '<div class="row"><span>Kontraktor</span><b>' + esc(k.nama||"—") + (k.id ? " · " + esc(k.id) : "") + '</b></div>'
    +  '<div class="row"><span>Kepakaran</span><b>' + esc(k.kepakaran||"—") + '</b></div>'
    +  '<div class="row"><span>Kawasan servis</span><b>' + esc(k.kawasan||"—") + '</b></div>'
    +  '<div class="row"><span>Telefon</span><b>' + esc(k.telefon||"—") + '</b></div>'
    +  '<div class="row"><span>Rating panel</span><b>' + (Number(k.rating)>0 ? '<span class="star">★</span> ' + Number(k.rating).toFixed(1) + ' / 5' : "—") + '</b></div>'
    +  '<div class="row"><span>Kadar tepat masa</span><b>' + (Number(k.tepat_masa)>0 ? Number(k.tepat_masa).toFixed(0) + "%" : "—") + '</b></div>'
    +  '<div class="row"><span>Kerja selesai direkod</span><b>' + (Number(k.bil_kerja)||0) + '</b></div>'
    +  '<div class="row"><span>Status panel</span><b>' + esc(k.status||"—") + '</b></div>'
    +  '<div class="row"><span>SSM / lesen</span><b>' + esc((k.ssm||"—") + (k.lesen ? " · " + k.lesen : "")) + '</b></div>'
    +  '<div class="row"><span>Didaftarkan</span><b>' + tkh(k.tarikh_daftar) + '</b></div>'
    +  '</div><div class="hint">Rating &amp; kadar tepat masa dikira oleh MT daripada rekod kerja sebenar (QC + tarikh siap).</div></div>';

  /* ---- sebutharga ---- */
  h += '<div class="card"><h2>📄 Sebut Harga (RFQ)</h2>';
  if (!(D.rfq||[]).length) h += '<div class="hint">Tiada permintaan sebut harga direkod untuk panel anda.</div>';
  else {
    h += '<table><tr><th>Ref / Unit</th><th>Skop</th><th class="num">Jumlah</th><th>Harap balas</th><th>Status</th></tr>';
    D.rfq.forEach(function(r){
      h += '<tr><td><b>' + esc(r.ref) + '</b><br><small>' + esc(r.unit||"—") + (r.jenis ? " · " + esc(r.jenis) : "") + '</small></td>'
        +  '<td>' + esc(String(r.skop||"").substring(0,90)) + (r.tempoh ? '<br><small>Tempoh ' + esc(r.tempoh) + ' hari · waranti ' + esc(r.waranti||"—") + ' bulan</small>' : '') + '</td>'
        +  '<td class="num">' + (Number(r.jumlah)>0 ? rm(r.jumlah) : "—") + '</td>'
        +  '<td>' + tkh(r.harap_balas) + '<br><small>' + esc(String(hariTeks(r.hari_balas)).replace(" · ","")) + '</small></td>'
        +  '<td>' + stRfq(r.status) + '</td></tr>';
    });
    h += '</table><div class="hint">Hantar/tambah nilai sebut harga melalui borang panel (butang di bawah).</div>';
  }
  h += '</div>';

  /* ---- work order ---- */
  h += '<div class="card"><h2>🏗️ Work Order</h2>';
  if (!(D.wo||[]).length) h += '<div class="hint">Tiada Work Order untuk panel anda buat masa ini.</div>';
  else {
    h += '<table><tr><th>No WO / Unit</th><th>Skop</th><th class="num">Nilai</th><th>Mula → Siap</th><th>Status</th></tr>';
    D.wo.forEach(function(w){
      h += '<tr><td><b>' + esc(w.no) + '</b><br><small>' + esc(w.unit||"—") + '</small></td>'
        +  '<td>' + esc(String(w.skop||"").substring(0,90)) + (Number(w.retensi)>0 ? '<br><small>Retensi ditahan ' + rm(w.retensi) + '</small>' : '') + '</td>'
        +  '<td class="num">' + rm(w.nilai) + '</td>'
        +  '<td>' + tkh(w.mula) + '<br>→ ' + tkh(w.siap_sasaran) + '<br><small>' + esc(String(hariTeks(w.hari_siap)).replace(" · ","")) + '</small></td>'
        +  '<td>' + stWo(w.status) + (w.laporan ? '<br><small><a href="' + esc(w.laporan) + '" target="_blank">Laporan kerja</a></small>' : '') + '</td></tr>';
    });
    h += '</table>';
  }
  h += '</div>';

  /* ---- tuntutan / bayaran ---- */
  h += '<div class="card"><h2>💰 Tuntutan &amp; Bayaran</h2>'
    +  '<div class="meta" style="margin-bottom:10px">'
    +  '<div class="row"><span>Belum dituntut</span><b>' + rm(kp.tuntutan_belum) + '</b></div>'
    +  '<div class="row"><span>Dalam proses (tuntutan/disahkan)</span><b>' + rm(kp.tuntutan_proses) + '</b></div>'
    +  '<div class="row"><span>Telah dibayar</span><b>' + rm(kp.dibayar) + '</b></div>'
    +  '<div class="row"><span>Retensi ditahan</span><b>' + rm(kp.retensi_ditahan) + '</b></div></div>';
  if (!(D.tahap||[]).length) h += '<div class="hint">Tiada jadual bayaran direkod.</div>';
  else {
    h += '<table><tr><th>Ref / Tahap</th><th>Perkara</th><th class="num">Bayar anda</th><th>Status</th></tr>';
    D.tahap.forEach(function(t){
      h += '<tr><td><b>' + esc(t.ref) + '</b><br><small>' + esc(t.no_wo) + ' · tahap ' + esc(String(t.tahap)) + '</small></td>'
        +  '<td>' + esc(String(t.perkara||"").substring(0,80)) + (t.syarat ? '<br><small>' + esc(String(t.syarat).substring(0,70)) + '</small>' : '') + '</td>'
        +  '<td class="num">' + rm(t.bayar_kontraktor) + (Number(t.retensi)>0 ? '<br><small>retensi ' + rm(t.retensi) + '</small>' : '') + '</td>'
        +  '<td>' + stTuntutan(t.status) + (t.tarikh_bayar ? '<br><small>bayar ' + tkh(t.tarikh_bayar) + '</small>' : (t.tuntutan ? '<br><small>tuntut ' + tkh(t.tuntutan) + '</small>' : '')) + '</td></tr>';
    });
    h += '</table>';
  }
  h += '<div class="hint">' + esc(D.nota || "") + '</div></div>';

  /* ---- tindakan & hubungi ---- */
  h += '<div class="card"><h2>📤 Hantar &amp; Hubungi MT</h2><div class="btnrow">';
  if (MOD === "token" && TOKEN) {
    h += '<a class="btn" href="aduan-kontraktor.html?t=' + encodeURIComponent(TOKEN) + '" style="text-align:center;text-decoration:none">Hantar sebut harga / laporan</a>';
  }
  h += '<a class="btn ghost" href="https://wa.me/60163119076?text=' + encodeURIComponent("Kontraktor " + (k.nama||"") + (k.id ? " (" + k.id + ")" : "") + " — ") + '" style="text-align:center;text-decoration:none">WhatsApp MT 016-311 9076</a>'
    +  '<a class="btn ghost" href="mailto:mrtanahmy@gmail.com" style="text-align:center;text-decoration:none">Emel MT</a></div>'
    +  '<div class="hint">Waktu pejabat Isnin–Jumaat 9:00 pg–6:00 ptg. Kecemasan kerja (air/elektrik) — WhatsApp 24 jam.</div></div>';

  document.getElementById("wrap").innerHTML = h;
  window.scrollTo(0,0);
}
function keluar(){ if (SB) SB.auth.signOut().then(function(){ location.href = "login.html"; }); else location.href = "login.html"; }
</script>
</body>
</html>
