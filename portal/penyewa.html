<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Portal Penyewa — Bil, Bayaran &amp; Aduan — Mr Tanah</title>
<style>
  :root { --mt:#123a7a; --mt-tua:#0a1f44; --hijau:#14905c; --oren:#e8862e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; background:#f2f6f4; color:#1d2b24; line-height:1.5; }
  .topbar { background:linear-gradient(135deg,#0a5c3c 0%,#123a7a 60%,#14905c 100%); color:#fff; padding:16px; }
  .topbar h1 { font-size:18px; } .topbar p { font-size:12.5px; opacity:.92; margin-top:2px; }
  .wrap { max-width:620px; margin:0 auto; padding:14px 14px 48px; }
  .card { background:#fff; border-radius:14px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:13px; }
  .card h2 { font-size:14.5px; color:var(--mt-tua); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .meta { background:#f6faf8; border:1px solid #e0eae3; border-radius:11px; padding:11px 12px; font-size:12.7px; }
  .meta b { color:var(--mt-tua); }
  .row { display:flex; justify-content:space-between; gap:10px; padding:3px 0; border-bottom:1px dashed #e6efe9; }
  .row:last-child { border:0; }
  .row span { color:#5a6b61; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th { background:#eef3f7; color:var(--mt-tua); text-align:left; padding:7px 5px; font-size:10.5px; }
  td { padding:9px 5px; border-top:1px solid #e9f0ec; vertical-align:top; }
  .num { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .btn { width:100%; padding:14px; background:var(--hijau); color:#fff; border:0; border-radius:11px; font-size:15px; font-weight:700; cursor:pointer; }
  .btn.sec { background:var(--mt); } .btn.ghost { background:#eef3f7; color:var(--mt-tua); }
  .btn:disabled { opacity:.55; cursor:not-allowed; }
  .btnrow { display:flex; gap:9px; flex-wrap:wrap; margin-top:12px; }
  .btnrow .btn { width:auto; flex:1; min-width:130px; }
  .ok { background:#e5f4ec; border:1px solid #bfe3cf; color:#0e5a33; border-radius:11px; padding:12px; font-size:13px; margin-top:11px; }
  .err { background:#fdeaea; border:1px solid #f2c2c2; color:#8c1f1f; border-radius:11px; padding:12px; font-size:13px; margin-top:11px; }
  .st { font-size:10px; font-weight:800; border-radius:20px; padding:2px 8px; display:inline-block; white-space:nowrap; }
  .s-wait { background:#eef3f7; color:#5a6b61; } .s-bad { background:#fdeaea; color:#a11; } .s-ok { background:#e5f4ec; color:#0e5a33; }
  .tl { position:relative; padding-left:20px; }
  .tl:before { content:""; position:absolute; left:5px; top:6px; bottom:6px; width:2px; background:#dfe8e3; }
  .ev { position:relative; padding-bottom:12px; font-size:12.3px; }
  .ev:before { content:""; position:absolute; left:-19px; top:4px; width:11px; height:11px; border-radius:50%; background:#cfdcd4; border:2px solid #fff; box-shadow:0 0 0 1.5px #cfdcd4; }
  .ev b { color:var(--mt-tua); display:block; font-size:12.6px; } .ev i { font-style:normal; color:#6a7a71; font-size:11px; }
  .qr { width:100%; max-width:230px; display:block; margin:0 auto; border:1px solid #e0eae3; border-radius:12px; }
  label { display:block; font-size:12.5px; font-weight:600; margin:11px 0 4px; }
  input, select, textarea { width:100%; padding:11px 12px; border:1.5px solid #cfdcd4; border-radius:10px; font-size:15px; background:#fbfdfc; font-family:inherit; }
  .hint { font-size:11.5px; color:#5a6b61; margin-top:6px; }
  .foot { text-align:center; font-size:11px; color:#6a7a71; margin-top:16px; }
  .splash { text-align:center; padding:40px 16px; color:#5a6b61; font-size:14px; }
  .big { font-size:28px; font-weight:800; color:var(--mt-tua); font-variant-numeric:tabular-nums; letter-spacing:-.3px; }
  .badge { font-size:10.5px; font-weight:800; background:#e8f5ee; color:#0e5a33; border-radius:20px; padding:3px 9px; }
</style>
</head>
<body>
  <div class="topbar">
    <h1>👤 Portal Penyewa</h1>
    <p id="sub">Mr Tanah · ZMJ Solutions — bil, bayaran &amp; aduan unit anda</p>
  </div>
  <div class="wrap" id="wrap">
    <div class="splash">Memuatkan…</div>
  </div>
  <div class="foot">Dokumen peribadi — pautan ini khas untuk unit anda. Jangan kongsi.</div>

<script>
var API = "https://script.google.com/macros/s/AKfycbwafaViIuCpc-Q0XnUpSHgkKVTFcyfPProf0GvSi9C-L22hUsZ_NA-03wXjd2F-GRIS/exec";
var TOKEN = new URLSearchParams(location.search).get("t") || "";
var D = null;
function rm(n){ return "RM " + Number(n||0).toLocaleString("ms-MY", {minimumFractionDigits:2, maximumFractionDigits:2}); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function tkh(s){ if(!s) return "—"; var d=String(s).substring(0,10).split("-"); return d.length===3 ? d[2]+"/"+d[1]+"/"+d[0] : String(s); }
function tempoh(s){ var t=String(s||""); var m=t.match(/^(\d{4})-(\d{2})/); return m ? m[2]+"/"+m[1] : tkh(t); }
function statusSt(s){ s=String(s||"").toUpperCase(); if(s.indexOf("DIBAYAR")>=0) return '<span class="st s-ok">DIBAYAR</span>'; if(s.indexOf("BELUM")>=0||s.indexOf("TERTUNGGAK")>=0) return '<span class="st s-bad">BELUM BAYAR</span>'; return '<span class="st s-wait">'+esc(s||"—")+'</span>'; }
function splash(m){ document.getElementById("wrap").innerHTML = '<div class="splash">'+m+'</div>'; }
function total(b){ return (b.sewa||0)+(b.elektrik||0)+(b.air||0)+(b.lain||0); }

if (!TOKEN) splash("⚠️ Pautan tidak lengkap (tiada token). Guna pautan yang dihantar Mr Tanah.");
else fetch(API + "?aksi=penyewa&token=" + encodeURIComponent(TOKEN))
  .then(function(r){ return r.json(); })
  .then(function(d){
    if (!d.ok) { splash("⚠️ " + esc(d.error || "Pautan tidak sah.")); return; }
    D = d; lukis();
  })
  .catch(function(e){ splash("⚠️ Gagal memuatkan data. Sila cuba lagi.<br><small>"+esc(e)+"</small>"); });

function lukis(){
  var u = D.unit, b = D.belum, h = "";
  document.getElementById("sub").textContent = "Mr Tanah · " + u.id + " — " + u.nama + (D.nama ? " · " + D.nama : "");

  h += '<div class="card"><h2>💳 Ringkasan Akaun <span class="badge">DATA SEBENAR</span></h2>';
  if (b) {
    h += '<div class="row"><span>Tempoh bil</span><b>' + tempoh(b.tempoh) + '</b></div>'
      +  '<div class="row"><span>Invois</span><b>' + esc(b.id) + '</b></div>'
      +  '<div class="row"><span>Sewa / Utiliti</span><b>' + rm(b.sewa) + ' / ' + rm((b.elektrik||0)+(b.air||0)+(b.lain||0)) + '</b></div>'
      +  '<div class="row"><span>Tarikh akhir</span><b>' + tkh(b.due) + '</b></div>'
      +  '<div class="row"><span>Status</span>' + statusSt(b.status) + '</div>'
      +  '<div style="margin-top:12px"><div class="hint">Jumlah perlu dibayar</div><div class="big">' + rm(total(b)) + '</div></div>'
      +  '<div class="hint">Guna <b>' + esc(b.id) + '</b> sebagai rujukan bayaran supaya MT boleh padankan bayaran anda dengan invois ini.</div>'
      +  '<div class="btnrow"><button class="btn" onclick="bayar(\'' + esc(b.id) + '\',' + total(b) + ')">Bayar Sekarang</button>'
      +  '<button class="btn ghost" onclick="alert(\'' + (b.pdf ? "PDF invois akan dibuka." : "PDF invois akan dimuat naik oleh MT.") + '\')">Invois (PDF)</button></div>';
  } else {
    h += '<div class="ok">✅ Tiada bil tertunggak. Terima kasih!</div>';
  }
  h += '</div>';

  h += '<div class="card"><h2>📍 Unit &amp; Kontrak</h2><div class="meta">'
    + '<div class="row"><span>Unit</span><b>' + esc(u.id) + ' · ' + esc(u.nama) + '</b></div>'
    + '<div class="row"><span>Penyewa</span><b>' + esc(u.penyewa || D.nama || "—") + '</b></div>'
    + '<div class="row"><span>Sewa bulanan</span><b>' + rm(u.sewa) + '</b></div>'
    + '<div class="row"><span>Deposit</span><b>' + esc(u.deposit || "—") + '</b></div>'
    + '<div class="row"><span>Tempoh sewa</span><b>' + esc(u.tempoh || "—") + '</b></div>'
    + '</div><div class="hint">Deposit dipegang oleh pemilik unit. Mr Tanah hanya merekod dan menyimpan bukti inventori serahan.</div></div>';

  h += '<div class="card"><h2>🧾 Sejarah Bil</h2><table><tr><th>Invois</th><th>Tempoh</th><th class="num">Jumlah</th><th>Due</th><th>Status</th></tr>';
  if (!D.invois.length) h += '<tr><td colspan="5">Tiada rekod</td></tr>';
  D.invois.forEach(function(i){
    h += '<tr><td><b>' + esc(i.id) + '</b></td><td>' + tempoh(i.tempoh) + '</td><td class="num">' + rm(i.jumlah) + '</td>'
      +  '<td>' + tkh(i.due) + '</td><td>' + statusSt(i.status) + '</td></tr>';
  });
  h += '</table>' + (D.bil.length ? '<h2 style="margin-top:14px">⚡ Bil utiliti</h2><table><tr><th>Jenis</th><th>Tempoh</th><th class="num">Amaun</th><th>Tanggungjawab</th></tr>'
    + D.bil.map(function(x){ return '<tr><td>' + esc(x.jenis) + '</td><td>' + tempoh(x.tempoh) + '</td><td class="num">' + rm(x.amaun) + '</td><td>' + esc(x.tanggungjawab) + '</td></tr>'; }).join("") + '</table>' : "")
    + '<div class="hint">Utiliti (TNB/Air) dibayar pendahuluan oleh ZMJ dan dituntut semula dalam invois sewa — angka sebenar bil bulan berkenaan.</div></div>';

  h += '<div class="card"><h2>🔧 Aduan &amp; Pembaikan</h2>';
  if (!D.tiket.length) h += '<div class="hint">Tiada aduan direkod untuk unit ini.</div>';
  D.tiket.forEach(function(t){
    h += '<div class="meta" style="margin-bottom:10px"><div class="row"><span>' + tkh(t.tarikh) + ' · ' + esc(t.jenis) + '</span><span class="st s-wait">' + esc(String(t.status||"").toUpperCase()) + '</span></div>'
      +  '<div style="margin:7px 0"><b>' + esc(t.ref) + '</b>' + (t.keutamaan ? ' · Keutamaan ' + esc(t.keutamaan) : '') + '</div>'
      +  '<div style="font-size:12.3px;color:#4c5c53">' + esc(String(t.keterangan||"").substring(0,300)) + '</div>'
      +  (t.kontraktor ? '<div class="row" style="margin-top:7px"><span>Kontraktor</span><b>' + esc(t.kontraktor) + '</b></div>' : '')
      +  (t.timeline && t.timeline.length ? '<div class="tl" style="margin-top:9px">' + t.timeline.slice(0,8).map(function(e){ return '<div class="ev"><b>' + esc(e.aksi) + '</b><i>' + esc(String(e.masa||"")) + ' — ' + esc(String(e.butiran||"").substring(0,160)) + '</i></div>'; }).join("") + '</div>' : '')
      +  '</div>';
  });
  h += '<div class="btnrow"><a class="btn sec" href="/portal/lapor-kerosakan.html" style="text-align:center;text-decoration:none">+ Lapor Kerosakan Baharu</a></div>'
    +  '<div class="hint">Aduan anda akan dijawab MT dalam 1 jam perniagaan (waktu pejabat).</div></div>';

  h += '<div class="card"><h2>💬 Hubungi Mr Tanah</h2>'
    + '<div class="btnrow"><a class="btn" href="https://wa.me/60163119076?text=' + encodeURIComponent("Portal penyewa " + u.id + (D.nama ? " (" + D.nama + ")" : "") + " — ") + '" style="text-align:center;text-decoration:none">WhatsApp 016-311 9076</a>'
    + '<a class="btn ghost" href="mailto:mrtanahmy@gmail.com" style="text-align:center;text-decoration:none">Emel MT</a></div>'
    + '<div class="hint">Waktu pejabat Isnin–Jumaat 9:00 pg–6:00 ptg. Kecemasan (air/elektrik) 24 jam.</div></div>';

  h += '<div id="bayar"></div>';
  document.getElementById("wrap").innerHTML = h;
  window.scrollTo(0,0);
}

/* ---- bahagian bayar (DuitNow QR statik + rujukan + pengakuan) ---- */
function bayar(inv, jumlah){
  var h = '<div class="card"><h2>💳 Bayar — ' + esc(inv) + '</h2>'
    + '<div class="meta"><div class="row"><span>Jumlah</span><b>' + rm(jumlah) + '</b></div>'
    + '<div class="row"><span>Rujukan WAJIB</span><b>' + esc(inv) + '</b></div>'
    + '<div class="row"><span>Penerima</span><b>ZMJ Solutions (Maybank)</b></div></div>'
    + '<div style="margin-top:12px"><img class="qr" src="/portal/assets/zmj-duitnow-qr.jpg" alt="DuitNow QR ZMJ Solutions"></div>'
    + '<div class="hint">Imbas dengan app bank / e-wallet (MAE, TNG, GrabPay, Boost, CIMB). <b>Masukkan ' + esc(inv) + ' dalam medan rujukan/nota</b> — supaya bayaran dipadankan automatik dengan invois anda.</div>'
    + '<label>Selepas bayar, sahkan di sini (MT akan sahkan &amp; hantar resit)</label>'
    + '<div class="row"><span>Kaedah</span><b>DuitNow QR</b></div>'
    + '<label>Tarikh bayar</label><input type="date" id="bTarikh" value="' + new Date().toISOString().substring(0,10) + '">'
    + '<label>Jumlah dibayar (RM)</label><input type="number" step="0.01" id="bJumlah" value="' + Number(jumlah).toFixed(2) + '">'
    + '<label>Rujukan transaksi (pilihan)</label><input id="bRef" placeholder="cth nombor rujukan DuitNow">'
    + '<label>Nota (pilihan)</label><textarea id="bNota" rows="2" placeholder="cth bayar separuh sahaja, bakinya 25hb"></textarea>'
    + '<div class="btnrow"><button class="btn" onclick="hantarBayar(\'' + esc(inv) + '\')">Hantar pengakuan bayaran</button>'
    + '<button class="btn ghost" onclick="document.getElementById(\'bayar\').innerHTML=\'\'">Tutup</button></div>'
    + '<div class="hint">Status invois kekal <b>Belum Bayar</b> sehingga MT semak penyata bank dan sahkan (biasanya 1 hari bekerja). Resit akan dihantar kemudian.</div></div>';
  document.getElementById("bayar").innerHTML = h;
  document.getElementById("bayar").scrollIntoView({behavior:"smooth"});
}

function hantarBayar(inv){
  var p = { form:"bayarsewa", token:TOKEN, invois:inv, kaedah:"DuitNow QR",
            tarikh_bayar:(document.getElementById("bTarikh")||{}).value || "",
            jumlah:(document.getElementById("bJumlah")||{}).value || 0,
            rujukan:(document.getElementById("bRef")||{}).value || "",
            nota:(document.getElementById("bNota")||{}).value || "" };
  document.getElementById("bayar").innerHTML = '<div class="card"><div class="splash">Menghantar pengakuan…</div></div>';
  fetch(API, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(p) })
    .then(function(r){ return r.json(); })
    .then(function(d){
      document.getElementById("bayar").innerHTML = '<div class="card"><h2>Bayaran</h2>'
        + '<div class="' + (d.ok ? "ok" : "err") + '">' + esc(d.msg || d.error || "Selesai") + (d.ok ? '<br><br>Rujukan sistem: <b>' + esc(inv) + '</b> · RM' + Number(d.jumlah||0).toFixed(2) : '') + '</div>'
        + '<div class="btnrow"><button class="btn ghost" onclick="document.getElementById(\'bayar\').innerHTML=\'\'">Tutup</button></div></div>';
    })
    .catch(function(e){ document.getElementById("bayar").innerHTML = '<div class="card"><div class="err">Gagal menghantar: ' + esc(e) + '</div></div>'; });
}
</script>
<script src="../assets/fasa1.js?v=1"></script>
<script src="../assets/ali-config.js?v=1"></script>
</body>
</html>
