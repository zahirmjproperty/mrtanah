<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Work Kanban + SLA Board (Internal) — Zentra Portal</title>
<style>
  :root { --mt:#123a7a; --mt-tua:#0a1f44; --hijau:#14905c; --oren:#e8862e; --merah:#c0392b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; background:#f2f6f4; color:#1d2b24; line-height:1.5; }
  .topbar { background:linear-gradient(135deg,#0a5c3c 0%,#123a7a 60%,#14905c 100%); color:#fff; padding:16px; }
  .topbar h1 { font-size:18px; } .topbar p { font-size:12.5px; opacity:.92; margin-top:2px; }
  .wrap { max-width:1100px; margin:0 auto; padding:14px 14px 48px; }
  .card { background:#fff; border-radius:14px; padding:15px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:13px; }
  .card h2 { font-size:14.5px; color:var(--mt-tua); margin-bottom:10px; }
  .kpi { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:13px; }
  .kpi div { flex:1; min-width:96px; background:#fff; border-radius:12px; padding:11px 8px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.07); }
  .kpi b { display:block; font-size:19px; color:var(--mt-tua); } .kpi span { font-size:10.3px; color:#5a6b61; font-weight:600; }
  .kpi .merah b { color:var(--merah); } .kpi .hijau b { color:var(--hijau); } .kpi .oren b { color:var(--oren); }
  .kanban { display:flex; gap:11px; overflow-x:auto; padding-bottom:8px; align-items:flex-start; }
  .col { flex:0 0 262px; background:#e9eff1; border-radius:12px; padding:9px; }
  .col h3 { font-size:12.3px; color:var(--mt-tua); display:flex; justify-content:space-between; align-items:center; padding:2px 3px 8px; }
  .col h3 em { font-style:normal; background:#fff; border-radius:20px; padding:1px 8px; font-size:11px; color:#5a6b61; }
  .kcard { background:#fff; border-radius:11px; padding:10px; margin-bottom:8px; box-shadow:0 1px 2px rgba(0,0,0,.09); cursor:pointer; border-left:4px solid #cfdcd4; }
  .kcard.ok { border-left-color:var(--hijau); } .kcard.warn { border-left-color:var(--oren); } .kcard.late { border-left-color:var(--merah); }
  .kcard .r { font-size:11.4px; font-weight:800; color:var(--mt); }
  .kcard .u { font-size:12.4px; font-weight:600; margin-top:2px; }
  .kcard .m { font-size:11.3px; color:#5a6b61; margin-top:4px; }
  .kcard .f { display:flex; justify-content:space-between; align-items:center; margin-top:7px; gap:6px; flex-wrap:wrap; }
  .sla { font-size:10.4px; font-weight:800; border-radius:8px; padding:2px 7px; }
  .sla.ok { background:#e5f4ec; color:#0e5a33; } .sla.warn { background:#fff4e2; color:#8a4c00; } .sla.late { background:#fdeaea; color:#a11; }
  .amt { font-size:12.3px; font-weight:800; color:var(--mt-tua); }
  .st { font-size:10px; font-weight:800; border-radius:20px; padding:2px 8px; display:inline-block; white-space:nowrap; }
  .pill { display:inline-block; font-size:12px; font-weight:700; border-radius:20px; padding:6px 12px; background:#eef3f7; color:#3c4a52; cursor:pointer; }
  .pill.on { background:var(--mt); color:#fff; }
  .btnrow { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .btn { padding:11px 16px; background:var(--hijau); color:#fff; border:0; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; }
  .btn.ghost { background:#eef3f7; color:var(--mt-tua); }
  .meta { background:#f6faf8; border:1px solid #e0eae3; border-radius:11px; padding:11px 12px; font-size:12.6px; }
  .row { display:flex; justify-content:space-between; gap:10px; padding:3px 0; border-bottom:1px dashed #e6efe9; }
  .row:last-child { border:0; } .row span { color:#5a6b61; }
  .modal { position:fixed; inset:0; background:rgba(10,31,68,.55); display:none; align-items:flex-start; justify-content:center; padding:16px; overflow:auto; z-index:60; }
  .modal.on { display:flex; }
  .modal .box { background:#fff; border-radius:14px; max-width:640px; width:100%; padding:17px; }
  .hint { font-size:11.5px; color:#5a6b61; margin-top:6px; }
  .foot { text-align:center; font-size:11px; color:#6a7a71; margin-top:16px; }
  .splash { text-align:center; padding:40px 16px; color:#5a6b61; font-size:14px; }
  input[type=password] { width:100%; padding:12px; border:1.5px solid #cfdcd4; border-radius:10px; font-size:15px; }
</style>
</head>
<body>
  <div class="topbar">
    <h1>🗂️ Work Kanban + SLA Board</h1>
    <p>Mr Tanah · ZMJ Solutions — internal view (tickets, priority, SLA)</p>
  </div>
  <div class="wrap" id="wrap"><div class="splash">Loading…</div></div>
  <div class="foot">MT internal — do not share this link.</div>

<script>
var API = "https://script.google.com/macros/s/AKfycbwafaViIuCpc-Q0XnUpSHgkKVTFcyfPProf0GvSi9C-L22hUsZ_NA-03wXjd2F-GRIS/exec";
var T = new URLSearchParams(location.search).get("t") || localStorage.getItem("mt_admin_token") || "";
var KAD = [], tapis = "aktif";
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function rm(n){ return "RM " + Number(n||0).toLocaleString("ms-MY", {minimumFractionDigits:2, maximumFractionDigits:2}); }
function tkh(s){ if(!s) return "—"; var d=String(s).substring(0,10).split("-"); return d.length===3 ? d[2]+"/"+d[1]+"/"+d[0] : String(s); }
function splash(m){ document.getElementById("wrap").innerHTML = '<div class="splash">'+m+'</div>'; }

function login(){
  document.getElementById("wrap").innerHTML = '<div class="card"><h2>Sign in to the MT board</h2>'
    + '<p class="hint">Enter the MT admin token (stored on this phone only).</p>'
    + '<label style="display:block;font-size:12.5px;font-weight:600;margin:11px 0 4px">Admin token</label>'
    + '<input type="password" id="tk" placeholder="mtadm-…">'
    + '<div class="btnrow" style="margin-top:12px"><button class="btn" id="bIn">Sign in</button></div>'
    + '<div id="lg"></div></div>';
  document.getElementById("bIn").onclick = function(){
    var v = document.getElementById("tk").value.trim();
    if (!v) return;
    localStorage.setItem("mt_admin_token", v); T = v; muat();
  };
}
function muat(){
  fetch(API + "?aksi=kanban&admin_token=" + encodeURIComponent(T))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d.ok) { localStorage.removeItem("mt_admin_token"); login();
        document.getElementById("lg").innerHTML = '<div class="err" style="margin-top:10px">'+esc(d.error||"Invalid token.")+'</div>'; return; }
      KAD = (d.kad || []).map(function(x){ x.lajur = lajurEN(x.lajur); return x; }); lukis(d.kpi || {});
    })
    .catch(function(e){ splash("⚠️ Failed to load: " + esc(e)); });
}
function lolos(k){
  if (tapis === "semua") return true;
  if (tapis === "aktif") return k.lajur !== "Completed";
  if (tapis === "lewat") return k.sla.keadaan === "late";
  if (tapis === "p12") return /^P1|^P2/.test(String(k.keutamaan||"").toUpperCase());
  if (tapis === "selesai") return k.lajur === "Completed";
  return true;
}
var KOL = ["New / Triage","Quotation / Approval","Repair in Progress","QC / Approval","Completed"];
/* The server sends the raw stage value; map it to the English column title (fragment match,
   so the matching keeps working even if the wording on the server side changes). */
function lajurEN(l){ var s = String(l==null?"":l);
  if (/triage/i.test(s)) return KOL[0];
  if (/harga/i.test(s))  return KOL[1];
  if (/dibaik/i.test(s)) return KOL[2];
  if (/qc/i.test(s))     return KOL[3];
  if (/selesai/i.test(s))return KOL[4];
  return s; }
function lukis(kpi){
  var h = '<div class="kpi">'
    + '<div><b>' + KAD.length + '</b><span>Tickets</span></div>'
    + '<div class="hijau"><b>' + (kpi.kerja||0) + '</b><span>In Repair</span></div>'
    + '<div class="oren"><b>' + (kpi.menunggu||0) + '</b><span>Waiting</span></div>'
    + '<div class="merah"><b>' + (kpi.lewat||0) + '</b><span>SLA Overdue</span></div>'
    + '<div><b>' + (kpi.selesai||0) + '</b><span>Completed</span></div></div>';

  h += '<div class="card"><h2>Filters</h2><div class="btnrow">'
    + ["aktif:Active","lewat:SLA Overdue","p12:Priority P1/P2","selesai:Completed","semua:All"].map(function(x){
        var a = x.split(":");
        return '<span class="pill' + (tapis===a[0] ? " on" : "") + '" data-f="' + a[0] + '">' + a[1] + '</span>';
      }).join("")
    + '<span style="flex:1"></span><button class="btn ghost" id="bOut">Sign out</button></div>'
    + '<div class="hint">SLA comes from the ticket <b>Priority</b> field: P1 4 hours · P2 24 hours · P3 72 hours · P4 7 days. A <b style="color:#c0392b">red</b> card = overdue, <b style="color:#e8862e">amber</b> = nearly due. Click a card for details.</div></div>';

  h += '<div class="card" style="padding:12px"><div class="kanban">';
  KOL.forEach(function(k){
    var kad = KAD.filter(function(x){ return x.lajur === k && lolos(x); });
    h += '<div class="col"><h3>' + k + '<em>' + kad.length + '</em></h3>';
    if (!kad.length) h += '<div class="hint" style="padding:6px 4px">No cards</div>';
    kad.forEach(function(x){
      var s = x.sla, kelas = s.keadaan, lbl = kelas === "late" ? ("OVERDUE " + Math.abs(s.baki) + "h") : (s.baki + "h left");
      h += '<div class="kcard ' + kelas + '" data-ref="' + esc(x.ref) + '">'
        + '<div class="r">' + esc(x.ref) + (x.keutamaan ? " · " + esc(x.keutamaan) : "") + '</div>'
        + '<div class="u">' + esc(x.unit) + '</div>'
        + '<div class="m">' + esc(x.jenis) + '<br>' + tkh(x.tarikh) + ' · ' + esc(x.pemilik || x.pelapor) + '</div>'
        + '<div class="f"><span class="sla ' + kelas + '">' + lbl + '</span><span class="amt">' + (x.nilai ? rm(x.nilai) : "—") + '</span></div>'
        + '<div class="m" style="margin-top:5px">' + (x.kontraktor ? "Contractor: <b>" + esc(x.kontraktor) + "</b>" : "Contractor: — not selected yet") + (x.no_wo ? " · " + esc(x.no_wo) : "") + '</div>'
        + '</div>';
    });
    h += '</div>';
  });
  h += '</div><div class="hint">Live data from the <b>Tickets</b>, <b>Sebutharga</b> and <b>Work Order</b> tabs — nothing is retyped.</div></div>';

  h += '<div class="card"><h2>🔗 Generate tenant portal link</h2><div class="btnrow">'
    + '<input id="uJana" placeholder="e.g. U-0001" style="flex:1;min-width:140px;padding:11px;border:1.5px solid #cfdcd4;border-radius:10px;font-size:14px">'
    + '<button class="btn" id="bJana">Generate / get link</button></div>'
    + '<div id="hJana" class="hint">A token link so the tenant can see bills, receipts, complaint status &amp; pay (DuitNow QR). An existing token will be reused (idempotent).</div></div>';

  document.getElementById("wrap").innerHTML = h;
  document.getElementById("bOut").onclick = function(){ localStorage.removeItem("mt_admin_token"); login(); };
  var bJ = document.getElementById("bJana");
  if (bJ) bJ.onclick = function(){
    var u = (document.getElementById("uJana").value || "").trim().toUpperCase();
    if (!u) return;
    document.getElementById("hJana").innerHTML = "Generating…";
    fetch(API, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({ form:"aksespenyewa", admin_token:T, unit:u }) })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d.ok) { document.getElementById("hJana").innerHTML = "⚠️ " + esc(d.error || "Failed"); return; }
        document.getElementById("hJana").innerHTML = '✅ <b>' + esc(d.unit) + '</b> · ' + esc(d.penyewa || "") + ' — ' + d.bil_belum_bayar + ' bil belum bayar<br>'
          + '<a href="' + esc(d.link) + '" target="_blank">' + esc(d.link) + '</a><br>'
          + '<button class="btn ghost" onclick="navigator.clipboard.writeText(\'' + esc(d.link) + '\')">Copy link</button> '
          + '<a class="btn" href="https://wa.me/?text=' + encodeURIComponent("Your tenant portal link: " + d.link) + '" target="_blank">Send WhatsApp</a>'
          + '<div class="hint">' + (d.sedia_ada ? "The existing token was reused." : "A new token was created.") + '</div>';
      })
      .catch(function(e){ document.getElementById("hJana").innerHTML = "⚠️ " + esc(e); });
  };
  Array.prototype.forEach.call(document.querySelectorAll(".pill"), function(p){
    p.onclick = function(){ tapis = p.dataset.f; muat(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll(".kcard"), function(c){
    c.onclick = function(){ detail(c.dataset.ref); };
  });
}
function detail(ref){
  var x = null; KAD.forEach(function(k){ if (k.ref === ref) x = k; });
  if (!x) return;
  var s = x.sla;
  var h = '<div class="box"><h2 style="font-size:15px;color:#0a1f44">' + esc(x.ref) + ' · ' + esc(x.lajur) + '</h2>'
    + '<div class="meta" style="margin-top:9px">'
    + '<div class="row"><span>Property</span><b>' + esc(x.unit) + '</b></div>'
    + '<div class="row"><span>Type</span><b>' + esc(x.jenis) + '</b></div>'
    + '<div class="row"><span>Reported by</span><b>' + esc(x.pelapor) + '</b></div>'
    + '<div class="row"><span>Owner</span><b>' + esc(x.pemilik) + '</b></div>'
    + '<div class="row"><span>Priority / SLA</span><b>' + esc(x.keutamaan || "—") + ' · ' + s.jam + ' hours (' + s.berlaku + ' hours elapsed)</b></div>'
    + '<div class="row"><span>Contractor</span><b>' + esc(x.kontraktor || "—") + (x.rating ? " ⭐ " + x.rating : "") + '</b></div>'
    + '<div class="row"><span>Work Order</span><b>' + esc(x.no_wo || "—") + '</b></div>'
    + '<div class="row"><span>Value</span><b>' + (x.nilai ? rm(x.nilai) : "—") + '</b></div>'
    + '<div class="row"><span>Quotation</span><b>' + x.bil_sh + ' received</b></div>'
    + '<div class="row"><span>System status</span><b>' + esc(x.status || "—") + '</b></div></div>'
    + '<div class="btnrow" style="margin-top:13px">'
    + '<a class="btn" href="/portal/aduan-mt.html?t=' + encodeURIComponent(T) + '" style="text-decoration:none">Open full flow (MT Board)</a>'
    + '<button class="btn ghost" id="bTutup">Close</button></div>'
    + '<div class="hint">Actions (RFQ, approval, WO, QC, payment) are done on the MT Board — this kanban board is for monitoring &amp; SLA only.</div></div>';
  document.getElementById("modal").innerHTML = h;
  document.getElementById("modal").classList.add("on");
  document.getElementById("bTutup").onclick = function(){ document.getElementById("modal").classList.remove("on"); };
}
if (!T) login(); else muat();
</script>
<div class="modal" id="modal"></div>
</body>
</html>
