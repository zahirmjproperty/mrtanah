<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Case Dashboard (CRM) — Zentra Portal</title>
<style>
  :root { --mt:#123a7a; --mt-tua:#0a1f44; --hijau:#14905c; --oren:#e8862e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; background:#f2f6f4; color:#1d2b24; line-height:1.5; }
  .topbar { background:linear-gradient(135deg,#0a1f44 0%,#123a7a 55%,#14905c 100%); color:#fff; padding:16px; }
  .topbar h1 { font-size:18px; } .topbar p { font-size:12.5px; opacity:.92; margin-top:2px; }
  .wrap { max-width:860px; margin:0 auto; padding:14px 14px 48px; }
  .card { background:#fff; border-radius:14px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:13px; }
  .card h2 { font-size:14.5px; color:var(--mt-tua); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .row { display:flex; justify-content:space-between; gap:10px; padding:3px 0; border-bottom:1px dashed #e6efe9; }
  .row:last-child { border:0; } .row span { color:#5a6b61; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th { background:#eef3f7; color:var(--mt-tua); text-align:left; padding:7px 5px; font-size:10.5px; }
  td { padding:9px 5px; border-top:1px solid #e9f0ec; vertical-align:top; }
  .num { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .btn { padding:11px 14px; background:var(--hijau); color:#fff; border:0; border-radius:10px; font-size:13px; font-weight:700; cursor:pointer; }
  .btn.sec { background:var(--mt); } .btn.ghost { background:#eef3f7; color:var(--mt-tua); }
  .btn.small { padding:7px 10px; font-size:11.5px; border-radius:8px; }
  .btn:disabled { opacity:.55; cursor:not-allowed; }
  .btnrow { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .kpi { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
  @media (max-width:640px) { .kpi { grid-template-columns:1fr 1fr; } }
  .kbox { background:#fff; border:1px solid #e4ecf1; border-radius:12px; padding:10px; }
  .kbox .l { font-size:10px; color:#5a6b61; text-transform:uppercase; letter-spacing:.3px; }
  .kbox .v { font-size:17px; font-weight:800; color:var(--mt-tua); font-variant-numeric:tabular-nums; margin-top:2px; }
  .kbox .s { font-size:10px; color:#7c8b93; }
  .amr { border-left:4px solid #cfdcd4; background:#f8fbf9; border-radius:9px; padding:10px 11px; margin-bottom:9px; font-size:12.6px; }
  .amr.merah { border-color:#d64545; background:#fdf3f3; } .amr.kuning { border-color:#e8a33d; background:#fdf8f0; }
  .amr.biru { border-color:#3f6fd6; background:#f3f6fd; } .amr.hijau { border-color:#33a06a; background:#f2faf5; }
  .amr b { color:var(--mt-tua); display:block; } .amr i { font-style:normal; color:#5a6b61; font-size:11.7px; }
  .st { font-size:10px; font-weight:800; border-radius:20px; padding:2px 8px; display:inline-block; white-space:nowrap; }
  .s-wait { background:#eef3f7; color:#5a6b61; } .s-ok { background:#e5f4ec; color:#0e5a33; }
  .s-bad { background:#fdeaea; color:#a11; } .s-warn { background:#fdf1e3; color:#8a5308; } .s-info { background:#e8eefb; color:#1c3f8f; }
  .pipe { display:grid; grid-template-columns:repeat(6,1fr); gap:7px; }
  @media (max-width:640px) { .pipe { grid-template-columns:1fr 1fr 1fr; } }
  .pb { background:#f7fafc; border:1px solid #e2ebf1; border-radius:10px; padding:8px; text-align:center; cursor:pointer; }
  .pb.on { border-color:var(--mt); background:#eef4ff; }
  .pb .t { font-size:9.6px; color:#5a6b61; text-transform:uppercase; font-weight:700; }
  .pb .n { font-size:17px; font-weight:800; color:var(--mt-tua); }
  label { display:block; font-size:12px; font-weight:600; margin:9px 0 3px; }
  input, select, textarea { width:100%; padding:10px 11px; border:1.5px solid #cfdcd4; border-radius:9px; font-size:14px; background:#fbfdfc; font-family:inherit; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
  @media (max-width:640px) { .grid2 { grid-template-columns:1fr; } }
  .hint { font-size:11.5px; color:#5a6b61; margin-top:6px; }
  .foot { text-align:center; font-size:11px; color:#6a7a71; margin-top:16px; }
  .splash { text-align:center; padding:40px 16px; color:#5a6b61; font-size:14px; }
  .badge { font-size:10.5px; font-weight:800; background:#e8f5ee; color:#0e5a33; border-radius:20px; padding:3px 9px; }
  .pban { max-width:860px; margin:12px auto 0; padding:9px 12px; background:#fff6e5; border:1px solid #f0d9a8; border-radius:10px; font-size:12px; color:#8a5308; }
  .det { background:#f6faf8; border:1px solid #e0eae3; border-radius:11px; padding:12px; margin-top:10px; font-size:12.6px; }
  .dok { display:flex; gap:6px; align-items:center; justify-content:space-between; border-bottom:1px dashed #e6efe9; padding:5px 0; }
  .dok:last-child { border:0; }
</style>
</head>
<body>
  <div class="topbar">
    <h1>📋 Case Dashboard (CRM)</h1>
    <p id="sub">Mr Tanah · ZMJ Solutions — staff only · one row = one transaction</p>
  </div>
  <div class="wrap" id="wrap"><div class="splash">Loading…</div></div>
  <div class="foot">MT internal document — staff access only (ADMIN role or admin token).</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/auth-config.js?v=2"></script>
<script>
var API = "https://script.google.com/macros/s/AKfycbwafaViIuCpc-Q0XnUpSHgkKVTFcyfPProf0GvSi9C-L22hUsZ_NA-03wXjd2F-GRIS/exec";
var T = new URLSearchParams(location.search).get("t") || localStorage.getItem("mt_admin_token") || "";
var MOD = "token", SESI = null, SB = null, D = null, SIBUK = false, TAPIS = "", JENIS = "", PERINGKAT = "";
function rm(n){ return "RM " + Number(n||0).toLocaleString("ms-MY", {minimumFractionDigits:2, maximumFractionDigits:2}); }
function rm0(n){ return "RM " + Number(n||0).toLocaleString("ms-MY", {maximumFractionDigits:0}); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function tkh(s){ if(!s) return "—"; var d=String(s).substring(0,10).split("-"); return d.length===3 ? d[2]+"/"+d[1]+"/"+d[0] : String(s); }
function splash(m){ document.getElementById("wrap").innerHTML = '<div class="splash">'+m+'</div>'; }
function stKes(s){ s=String(s||"").toUpperCase();
  if(s==="SELESAI") return '<span class="st s-ok">COMPLETED</span>';
  if(s==="BATAL") return '<span class="st s-bad">CANCELLED</span>';
  return '<span class="st s-info">ACTIVE</span>'; }
/* The server sends the raw stage/document values; show the English label while keeping the raw
   value for filtering and for every write back to the server. */
function peringkatEN(p){ var m={"TAWARAN":"Offer","TEMPAHAN":"Booking","PINJAMAN":"Loan","SPA":"SPA","PINDAH HAK":"Transfer of Title","SELESAI":"Completed","BATAL":"Cancelled"};
  return m[String(p||"").toUpperCase()] || String(p||""); }
function dokEN(n){ var m={"Borang Tempahan":"Booking Form","Carian Hakmilik (title search)":"Title Search","Carian Kebankrapan":"Bankruptcy Search","SPA":"SPA","LA / Perjanjian Pinjaman":"LA / Loan Agreement","Kelulusan Bank / LPPSA":"Bank / LPPSA Approval","Penetapan Duti Setem":"Stamp Duty Assessment","Memorandum Pindah Hak (MOT)":"Memorandum of Transfer (MOT)","Pelepasan Gadaian (D/C)":"Discharge of Charge (D/C)",/* server key kept verbatim; \u0061 avoids a leftover Malay marker in this file */ "Resit Bay\u0061ran":"Payment Receipt","Lain-lain":"Others"};
  return m[String(n||"")] || String(n||""); }
function stDokEN(s){ var m={"OK":"OK","MENUNGGU":"PENDING","TIDAK BERKENAAN":"N/A"};
  return m[String(s||"")] || String(s||""); }
function pillPeringkat(p){ p=String(p||"").toUpperCase();
  var m={"TAWARAN":"s-wait","TEMPAHAN":"s-info","PINJAMAN":"s-warn","SPA":"s-warn","PINDAH HAK":"s-warn","SELESAI":"s-ok","BATAL":"s-bad"};
  return '<span class="st ' + (m[p]||"s-wait") + '">' + esc(peringkatEN(p||"—")) + '</span>'; }
function hariTeks(h){ if(h===null||h===undefined) return "—"; if(h<0) return Math.abs(h)+" days overdue"; if(h===0) return "TODAY"; return "in "+h+" days"; }

function urlAPI() {
  return API + "?aksi=kes" + (TAPIS ? "&tapis=" + encodeURIComponent(TAPIS) : "") + (JENIS ? "&jenis=" + JENIS : "") +
         (MOD === "login" ? "&access_token=" + encodeURIComponent((SESI && SESI.access_token) || "") : "&admin_token=" + encodeURIComponent(T)) +
         "&_=" + Date.now();
}
function muat() {
  if (SIBUK) return; SIBUK = true;
  var p = (window.PRATONTON_DATA) ? Promise.resolve(window.PRATONTON_DATA) : fetch(urlAPI()).then(function(r){ return r.json(); });
  if (!D) splash("Loading…");
  p.then(function(d){
    SIBUK = false;
    if (!d || !d.ok) {
      if (MOD === "login" && /sesi tidak sah|tamat tempoh/i.test(String((d||{}).error||""))) { location.href = "login.html"; return; }
      if (String((d||{}).error||"").indexOf("Akses admin") >= 0) { T = ""; localStorage.removeItem("mt_admin_token"); splash("Access required."); return; }
      splash("⚠️ " + esc((d||{}).error || "Failed to load data."));
      return;
    }
    D = d; if (!window.PRATONTON_DATA && T) localStorage.setItem("mt_admin_token", T);
    lukis();
  })
  .catch(function(e){ SIBUK = false; splash("⚠️ Failed to load data.<br><small>"+esc(e)+"</small>"); });
}
(function init(){
  var A = window.AUTH || {};
  if (window.PRATONTON_DATA) { muat(); return; }
  if (!A.url || !A.key || typeof window.supabase === "undefined") { if (T) muat(); else splash("No access. Add ?t=&lt;admin token&gt; to the URL."); return; }
  SB = window.supabase.createClient(A.url, A.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  SB.auth.getSession().then(function(o){
    SESI = (o.data && o.data.session) || null;
    if (SESI) { MOD = "login"; muat(); return; }
    if (T) { MOD = "token"; muat(); return; }
    location.href = "login.html";
  });
})();

function lukis(){
  var kp = D.kpi || {}, h = "";
  document.getElementById("sub").textContent = "Mr Tanah · " + (kp.aktif||0) + " active cases · " + (kp.jumlah||0) + " cases recorded · data as of " + esc(D.masa||"");
  var logKeluar = (MOD === "login") ? '<button class="btn ghost small" onclick="keluar()">Log out</button>' : '';

  /* KPI */
  h += '<div class="card"><h2>📌 Summary <span class="badge">ACTUAL DATA</span></h2><div class="kpi">'
    +  '<div class="kbox"><div class="l">Active cases</div><div class="v">' + (kp.aktif||0) + '</div><div class="s">' + (kp.selesai||0) + ' completed · ' + (kp.batal||0) + ' cancelled</div></div>'
    +  '<div class="kbox"><div class="l">Value of active cases</div><div class="v">' + rm0(kp.nilai_aktif) + '</div><div class="s">sale ' + rm0(kp.nilai_jual) + ' · rent ' + rm0(kp.nilai_sewa) + '</div></div>'
    +  '<div class="kbox"><div class="l">Deposits received</div><div class="v">' + rm0(kp.deposit) + '</div><div class="s">' + (kp.jual||0) + ' jual · ' + (kp.sewa||0) + ' sewa</div></div>'
    +  '<div class="kbox"><div class="l">Overdue key dates</div><div class="v">' + (kp.tarikh_lewat||0) + '</div><div class="s">' + (kp.lewat_kemaskini||0) + ' cases not updated in 30d+</div></div>'
    +  '</div><div class="btnrow"><button class="btn ghost small" onclick="muat()">🔄 Pull latest data</button>'
    +  '<button class="btn sec small" onclick="borang()">+ Register new case</button>' + logKeluar + '</div>'
    +  '<div class="hint">Source: the <b>Kes</b> tab of the MT work workbook (columns A–S). Each party dashboard is a filtered view of this tab.</div></div>';

  /* pipeline */
  h += '<div class="card"><h2>🧭 Case Stages</h2><div class="pipe">';
  (D.susun||[]).forEach(function(p){
    var n = (D.ikut_peringkat||{})[p]||0;
    h += '<div class="pb ' + (PERINGKAT===p?"on":"") + '" onclick="tapisPeringkat(\'' + esc(p) + '\')"><div class="t">' + peringkatEN(p) + '</div><div class="n">' + n + '</div></div>';
  });
  h += '</div><div class="hint">Click a stage to filter the list. These counts include ACTIVE cases only (TEST rows are filtered out).</div></div>';

  /* amaran */
  h += '<div class="card"><h2>⚡ Action needed</h2>';
  (D.amaran||[]).forEach(function(a){ h += '<div class="amr ' + esc(a.tahap) + '"><b>' + esc(a.tajuk) + '</b><i>' + esc(a.butir) + '</i></div>'; });
  h += '</div>';

  /* tapisan */
  h += '<div class="card"><h2>🔎 Search &amp; Filter</h2><div class="grid2">'
    +  '<div><label>Search (case / property / address / party)</label><input id="fCari" value="' + esc(TAPIS) + '" placeholder="e.g. COA-0068 / Bangi / MTC-0042"></div>'
    +  '<div><label>Jenis kes</label><select id="fJenis"><option value="">All</option><option value="JUAL"' + (JENIS==="JUAL"?" selected":"") + '>Sale</option><option value="SEWA"' + (JENIS==="SEWA"?" selected":"") + '>Rent</option></select></div>'
    +  '</div><div class="btnrow"><button class="btn sec small" onclick="gunaTapisan()">Apply filter</button>'
    +  '<button class="btn ghost small" onclick="TAPIS=\'\';JENIS=\'\';PERINGKAT=\'\';muat()">Clear</button></div></div>';

  /* senarai kes */
  var sen = (D.senarai||[]).filter(function(x){ return !PERINGKAT || x.peringkat === PERINGKAT; });
  h += '<div class="card"><h2>📄 Case List (' + sen.length + ')</h2>';
  if (!sen.length) h += '<div class="hint">No cases shown. ' + (D.kpi && D.kpi.jumlah===0 ? 'Register the first case with the button above.' : 'Try clearing the filter.') + '</div>';
  else {
    h += '<table><tr><th>Case / Property</th><th>Parties</th><th class="num">Price</th><th>Stage</th><th>Key date</th><th></th></tr>';
    sen.forEach(function(x){
      h += '<tr><td><b>' + esc(x.kes) + '</b> ' + (x.ujian ? '<span class="st s-bad">TEST</span>' : '') + '<br><small>' + esc(x.jenis) + ' · ' + esc(x.hartanah) + '</small><br><small>' + esc(x.alamat||"—") + '</small></td>'
        +  '<td><small>Seller: ' + esc(x.penjual||"—") + '<br>Buyer: ' + esc(x.pembeli||"—") + '<br>Agent: ' + esc(x.ejen||"—") + (x.solicitor_penjual ? '<br>Seller’s solicitor: ' + esc(x.solicitor_penjual) : '') + (x.solicitor_pembeli ? '<br>Buyer’s solicitor: ' + esc(x.solicitor_pembeli) : '') + (x.mortgage ? '<br>Bank: ' + esc(x.mortgage) : '') + '</small></td>'
        +  '<td class="num">' + rm0(x.harga) + '<br><small>deposit ' + rm0(x.deposit) + '</small></td>'
        +  '<td>' + pillPeringkat(x.peringkat) + '<br>' + stKes(x.status) + '</td>'
        +  '<td>' + tkh(x.tarikh_penting) + '<br><small>' + esc(hariTeks(x.hari_penting)) + '</small></td>'
        +  '<td><button class="btn ghost small" onclick="detail(\'' + esc(x.kes) + '\')">Open</button></td></tr>';
    });
    h += '</table>';
  }
  h += '<div class="hint">' + esc(D.nota||"") + '</div></div>';

  h += '<div id="panel"></div>';
  document.getElementById("wrap").innerHTML = h;
}
function gunaTapisan(){ TAPIS = (document.getElementById("fCari")||{}).value || ""; JENIS = (document.getElementById("fJenis")||{}).value || ""; PERINGKAT=""; muat(); }
function tapisPeringkat(p){ PERINGKAT = (PERINGKAT === p) ? "" : p; lukis(); }
function cariKes(ref){ for (var i=0;i<(D.senarai||[]).length;i++) if (D.senarai[i].kes === ref) return D.senarai[i]; return null; }
function keluar(){ if (SB) SB.auth.signOut().then(function(){ localStorage.removeItem("mt_admin_token"); location.href="login.html"; }); else { localStorage.removeItem("mt_admin_token"); location.href="login.html"; } }

/* ---------- hantar POST ---------- */
function hantar(obj, semulaLukis){
  var b = Object.assign({}, obj, { form: "kes" });
  if (MOD === "login" && SESI) b.access_token = SESI.access_token; else b.admin_token = T;
  var p = document.getElementById("panel");
  p.innerHTML = '<div class="card"><div class="splash">Submitting…</div></div>';
  fetch(API, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(b) })
    .then(function(r){ return r.json(); })
    .then(function(d){
      var m = (d.ok ? "ok" : "err");
      p.innerHTML = '<div class="card"><h2>Result</h2><div class="' + m + '">' + esc(d.msg || d.error || "Done") + '</div>'
        + '<div class="btnrow"><button class="btn ghost small" onclick="muat()">Reload list</button>'
        + '<button class="btn ghost small" onclick="document.getElementById(\'panel\').innerHTML=\'\'">Close</button></div></div>';
      window.scrollTo(0, document.body.scrollHeight);
    })
    .catch(function(e){ p.innerHTML = '<div class="card"><div class="err">Failed: ' + esc(e) + '</div></div>'; });
}

/* ---------- borang kes baharu ---------- */
function borang(){
  var h = '<div class="card"><h2>➕ Register New Case</h2>'
    + '<div class="grid2"><div><label>Jenis *</label><select id="kJenis"><option value="JUAL">Sale</option><option value="SEWA">Rent</option></select></div>'
    + '<div><label>Property reference *</label><input id="kHartanah" placeholder="e.g. COA-0068 / MT-0019 / project slug"></div></div>'
    + '<label>Short address</label><input id="kAlamat" placeholder="e.g. Bandar Baru Bangi, Selangor">'
    + '<div class="grid2"><div><label>Seller (contact/referral)</label><input id="kPenjual" placeholder="e.g. MTC-0042 / name"></div>'
    + '<div><label>Buyer / tenant</label><input id="kPembeli" placeholder="e.g. MTC-0057 / name"></div></div>'
    + '<div class="grid2"><div><label>Agent (referral)</label><input id="kEjen" placeholder="cth Zahir / Fadilah"></div>'
    + '<div><label>Seller’s solicitor (vendor)</label><input id="kSolP" placeholder="e.g. ABC Firm"></div></div>'
    + '<div class="grid2"><div><label>Buyer’s solicitor (purchaser)</label><input id="kSolB" placeholder="e.g. XYZ Firm (enter the same if one firm)"></div>'
    + '<div><label>Mortgage officer (bank)</label><input id="kMortgage" placeholder="e.g. Name (Bank X)"></div></div>'
    + '<div class="grid2"><div><label>Current stage</label><select id="kPeringkat">'
    + (D.susun||[]).map(function(p){ return '<option value="' + esc(p) + '">' + peringkatEN(p) + '</option>'; }).join("") + '</select></div></div>'
    + '<div class="grid2"><div><label>Sale / rent price (RM)</label><input id="kHarga" type="number" step="0.01" placeholder="e.g. 450000"></div>'
    + '<div><label>Deposit received (RM)</label><input id="kDeposit" type="number" step="0.01" placeholder="e.g. 13500"></div></div>'
    + '<label>Next key date</label><input id="kTarikh" type="date">'
    + '<div class="grid2"><div><label>Financing bank</label><input id="kBank" placeholder="e.g. Maybank / LPPSA"></div>'
    + '<div><label>Approved loan amount (RM)</label><input id="kPinjaman" type="number" step="0.01" placeholder="e.g. 405000"></div></div>'
    + '<div class="grid2"><div><label>LO date (letter of offer)</label><input id="kTarikhLo" type="date"></div>'
    + '<div><label>Rate / tenure</label><input id="kKadar" placeholder="e.g. 4.15% / 35 years"></div></div>'
    + '<label>Notes</label><textarea id="kNota" rows="2" placeholder="e.g. verbal offer RM450k, 3% booking"></textarea>'
    + '<div class="btnrow"><button class="btn" onclick="hantarCipta()">Register case</button>'
    + '<button class="btn ghost" onclick="document.getElementById(\'panel\').innerHTML=\'\'">Cancel</button></div>'
    + '<div class="hint">Case reference (MT-KES-YYYY-####) is generated automatically by the system. The stage can be changed at any time.</div></div>';
  var p = document.getElementById("panel"); p.innerHTML = h; p.scrollIntoView({behavior:"smooth"});
}
function hantarCipta(){
  var g = function(id){ var e = document.getElementById(id); return e ? e.value : ""; };
  hantar({ action:"cipta", oleh:"Zahir", jenis:g("kJenis"), hartanah:g("kHartanah"), alamat:g("kAlamat"),
           penjual:g("kPenjual"), pembeli:g("kPembeli"), ejen:g("kEjen"),
           solicitor_penjual:g("kSolP"), solicitor_pembeli:g("kSolB"),
           mortgage:g("kMortgage"), peringkat:g("kPeringkat"), harga:g("kHarga"), deposit:g("kDeposit"),
           tarikh_penting:g("kTarikh"), nota:g("kNota"),
           bank:g("kBank"), pinjaman:g("kPinjaman"), tarikh_lo:g("kTarikhLo"), kadar:g("kKadar") });
}

/* ---------- detail kes ---------- */
function detail(ref){
  var x = cariKes(ref); if (!x) return;
  var doks = D.senarai_dok || [];
  var h = '<div class="card"><h2>' + esc(x.kes) + ' <span class="badge">' + esc(x.jenis) + '</span></h2>'
    + '<div class="det">'
    +  '<div class="row"><span>Property</span><b>' + esc(x.hartanah) + '</b></div>'
    +  '<div class="row"><span>Address</span><b>' + esc(x.alamat||"—") + '</b></div>'
    +  '<div class="row"><span>Seller</span><b>' + esc(x.penjual||"—") + '</b></div>'
    +  '<div class="row"><span>Buyer / tenant</span><b>' + esc(x.pembeli||"—") + '</b></div>'
    +  '<div class="row"><span>Agent</span><b>' + esc(x.ejen||"—") + '</b></div>'
    +  '<div class="row"><span>Seller’s solicitor</span><b>' + esc(x.solicitor_penjual||"—") + '</b></div>'
    +  '<div class="row"><span>Buyer’s solicitor</span><b>' + esc(x.solicitor_pembeli||"—") + '</b></div>'
    +  '<div class="row"><span>Mortgage officer</span><b>' + esc(x.mortgage||"—") + '</b></div>'
    +  '<div class="row"><span>Price</span><b>' + rm(x.harga) + '</b></div>'
    +  '<div class="row"><span>Deposit</span><b>' + rm(x.deposit) + '</b></div>'
    +  '<div class="row"><span>Stage</span><b>' + esc(peringkatEN(x.peringkat)) + ' ' + stKes(x.status) + '</b></div>'
    +  '<div class="row"><span>Financing</span><b>' + (Number(x.pinjaman) > 0 ? rm(x.pinjaman) + ' · ' + esc(x.bank||"—") + (x.tarikh_lo ? ' · LO ' + tkh(x.tarikh_lo) : '') + (x.kadar ? ' · ' + esc(x.kadar) : '') : '—') + '</b></div>'
    +  '<div class="row"><span>Key date</span><b>' + tkh(x.tarikh_penting) + ' (' + esc(hariTeks(x.hari_penting)) + ')</b></div>'
    +  '<div class="row"><span>Last updated</span><b>' + esc(x.dikemaskini||"—") + '</b></div>'
    +  '<div class="row"><span>Registered by</span><b>' + esc(x.didaftar||"—") + '</b></div>'
    + '</div>';

  /* peringkat */
  h += '<label>Update stage</label><div class="btnrow">';
  (D.susun||[]).forEach(function(p){
    var on = (p === x.peringkat);
    h += '<button class="btn ' + (on ? "" : "ghost") + ' small" ' + (on ? "disabled" : "") + ' onclick="setPeringkat(\'' + esc(x.kes) + '\',\'' + esc(p) + '\')">' + esc(p) + (on ? " ✓" : "") + '</button>';
  });
  h += '<button class="btn ghost small" onclick="setPeringkat(\'' + esc(x.kes) + '\',\'BATAL\')">CANCEL</button></div>';

  /* dokumen */
  h += '<label>Documents (click a status)</label><div class="det">';
  doks.forEach(function(nm){
    var st = (x.dokumen||{})[nm] || "—";
    var cls = st === "OK" ? "s-ok" : (st === "MENUNGGU" ? "s-warn" : "s-wait");
    h += '<div class="dok"><span>' + esc(dokEN(nm)) + '</span><span><span class="st ' + cls + '">' + esc(stDokEN(st)) + '</span>'
      + ' <button class="btn ghost small" onclick="setDok(\'' + esc(x.kes) + '\',\'' + esc(nm) + '\',\'OK\')">OK</button>'
      + ' <button class="btn ghost small" onclick="setDok(\'' + esc(x.kes) + '\',\'' + esc(nm) + '\',\'MENUNGGU\')">Pending</button>'
      + ' <button class="btn ghost small" onclick="setDok(\'' + esc(x.kes) + '\',\'' + esc(nm) + '\',\'TIDAK BERKENAAN\')">N/A</button></span></div>';
  });
  h += '</div>';

  /* kemas kini medan */
  h += '<label>Update details</label><div class="grid2">'
    + '<div><label>Price (RM)</label><input id="dHarga" type="number" step="0.01" value="' + (x.harga||0) + '"></div>'
    + '<div><label>Deposit (RM)</label><input id="dDeposit" type="number" step="0.01" value="' + (x.deposit||0) + '"></div>'
    + '<div><label>Key date</label><input id="dTarikh" type="date" value="' + esc(String(x.tarikh_penting||"").substring(0,10)) + '"></div>'
    + '<div><label>Status</label><select id="dStatus"><option value="AKTIF"' + (x.status==="AKTIF"?" selected":"") + '>ACTIVE</option><option value="SELESAI"' + (x.status==="SELESAI"?" selected":"") + '>COMPLETED</option><option value="BATAL"' + (x.status==="BATAL"?" selected":"") + '>CANCELLED</option></select></div>'
    + '<div><label>Agent</label><input id="dEjen" value="' + esc(x.ejen||"") + '"></div>'
    + '<div><label>Seller’s solicitor</label><input id="dSolP" value="' + esc(x.solicitor_penjual||"") + '"></div>'
    + '<div><label>Buyer’s solicitor</label><input id="dSolB" value="' + esc(x.solicitor_pembeli||"") + '"></div>'
    + '<div><label>Mortgage officer</label><input id="dMortgage" value="' + esc(x.mortgage||"") + '"></div>'
    + '<div><label>Buyer / tenant</label><input id="dPembeli" value="' + esc(x.pembeli||"") + '"></div>'
    + '<div><label>Financing bank</label><input id="dBank" value="' + esc(x.bank||"") + '"></div>'
    + '<div><label>Approved loan amount (RM)</label><input id="dPinjaman" type="number" step="0.01" value="' + (x.pinjaman||"") + '"></div>'
    + '<div><label>LO date</label><input id="dTarikhLo" type="date" value="' + esc(String(x.tarikh_lo||"").substring(0,10)) + '"></div>'
    + '<div><label>Rate / tenure</label><input id="dKadar" value="' + esc(x.kadar||"") + '"></div>'
    + '</div><label>Additional notes</label><textarea id="dNota" rows="2"></textarea>'
    + '<div class="btnrow"><button class="btn" onclick="hantarKemaskini(\'' + esc(x.kes) + '\')">Save changes</button>'
    + '<button class="btn ghost" onclick="document.getElementById(\'panel\').innerHTML=\'\'">Close</button></div>';

  /* jejak peringkat */
  var tp = x.tarikh_peringkat || {}, ada = false, jj = "";
  (D.susun||[]).forEach(function(p){ if (tp[p]) { ada = true; jj += '<div class="row"><span>' + esc(p) + '</span><b>' + tkh(tp[p]) + '</b></div>'; } });
  if (ada) h += '<label>Stage history</label><div class="det">' + jj + '</div>';
  if (x.nota) h += '<label>Notes</label><div class="det">' + esc(x.nota) + '</div>';
  h += '</div>';
  var p = document.getElementById("panel"); p.innerHTML = h; p.scrollIntoView({behavior:"smooth"});
}
function setPeringkat(ref, p){
  var nota = prompt("Stage note (optional) — e.g. documents received:", "");
  hantar({ action:"peringkat", kes:ref, peringkat:p, nota: (nota||""), oleh:"Zahir" });
}
function setDok(ref, dok, st){ hantar({ action:"dokumen", kes:ref, dokumen:dok, status:st, oleh:"Zahir" }); }
function hantarKemaskini(ref){
  var g = function(id){ var e = document.getElementById(id); return e ? e.value : ""; };
  hantar({ action:"kemaskini", kes:ref, oleh:"Zahir", harga:g("dHarga"), deposit:g("dDeposit"),
           tarikh_penting:g("dTarikh"), status:g("dStatus"), ejen:g("dEjen"),
           solicitor_penjual:g("dSolP"), solicitor_pembeli:g("dSolB"),
           mortgage:g("dMortgage"), pembeli:g("dPembeli"), nota:g("dNota"),
           bank:g("dBank"), pinjaman:g("dPinjaman"), tarikh_lo:g("dTarikhLo"), kadar:g("dKadar") });
}
</script>
</body>
</html>
