<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Dashboard Pembeli Hasil Ladang — Mr Tanah</title>
<style>
  :root{ --ijau:#0e6b3a; --ijau2:#12854a; --bg:#f4f7f5; --kad:#fff; --garis:#dbe4de; --teks:#16281e; --redup:#5f7269; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--teks)}
  .topbar{background:linear-gradient(135deg,#0b552e,#12854a);color:#fff;padding:22px 18px}
  .topbar h1{margin:0;font-size:20px}
  .topbar p{margin:5px 0 0;opacity:.9;font-size:13px}
  .wrap{max-width:760px;margin:14px auto 0;padding:0 14px 40px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
  .kbox{background:var(--kad);border:1px solid var(--garis);border-radius:12px;padding:12px}
  .kbox .l{font-size:12px;color:var(--redup)}
  .kbox .v{font-size:19px;font-weight:700;margin-top:4px}
  .kbox .s{font-size:12px;color:var(--redup);margin-top:3px}
  .kad{background:var(--kad);border:1px solid var(--garis);border-radius:14px;padding:14px;margin:12px 0}
  .kad h2{margin:0 0 10px;font-size:16px}
  .row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--garis);font-size:14px}
  .row:first-of-type{border-top:0}
  .row span{color:var(--redup)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--garis);vertical-align:top}
  th{color:var(--redup);font-weight:600;font-size:12px;text-transform:uppercase}
  .badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;background:#e8f4ec;color:#0e6b3a;border:1px solid #bfe0cc}
  .badge.kurang{background:#fdeaea;color:#a12a2a;border-color:#f2c4c4}
  .badge.more{background:#eef4ff;color:#1b4f9c;border-color:#c9dcff}
  .amaran{border-left:4px solid #d99b06;background:#fffaf0;padding:10px 12px;border-radius:8px;margin:8px 0;font-size:13.5px}
  .amaran.ok{border-color:#12854a;background:#f2fbf6}
  .splash{text-align:center;padding:34px 10px;color:var(--redup)}
  .foot{text-align:center;color:var(--redup);font-size:12px;padding:16px}
  .btn{display:inline-block;background:var(--ijau);color:#fff;text-decoration:none;padding:10px 14px;border-radius:10px;font-size:14px;margin:4px 6px 0 0}
  .btn.alt{background:#fff;color:var(--ijau);border:1px solid var(--ijau)}
  .hint{font-size:12px;color:var(--redup);margin-top:6px}
  .banner{background:#0e6b3a;color:#fff;padding:8px 12px;font-size:12.5px;text-align:center}
</style>
</head>
<body>
  <div class="topbar"><h1>🌾 Portal Pembeli Hasil Ladang</h1><p id="sub">Mr Tanah · pengendali Strategic Agro Technology (SAT)</p></div>
  <div id="navPhmt" style="max-width:760px;margin:14px auto 0;padding:0 14px"></div>
  <div class="wrap" id="wrap"><div class="splash">Memuatkan…</div></div>
  <div class="foot">Dokumen peribadi — pautan/akaun ini khas untuk anda. Jangan kongsi.</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/auth-config.js?v=2"></script>
<script src="assets/auth-nav.js?v=8"></script>
<script>
var API = "https://script.google.com/macros/s/AKfycbwafaViIuCpc-Q0XnUpSHgkKVTFcyfPProf0GvSi9C-L22hUsZ_NA-03wXjd2F-GRIS/exec";
var TOKEN = new URLSearchParams(location.search).get("t") || "";
var MOD = "token", SESI = null, SB = null, D = null;
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function rm(n){ return "RM " + Number(n||0).toLocaleString("ms-MY", {minimumFractionDigits:2, maximumFractionDigits:2}); }
function rm0(n){ return "RM " + Number(n||0).toLocaleString("ms-MY", {maximumFractionDigits:0}); }
function tkh(s){ if(!s) return "—"; var d=String(s).substring(0,10).split("-"); return d.length===3 ? d[2]+"/"+d[1]+"/"+d[0] : String(s); }
function bln(s){ if(!s) return "—"; var b=["Jan","Feb","Mac","Apr","Mei","Jun","Jul","Ogos","Sep","Okt","Nov","Dis"]; var d=String(s).substring(0,7).split("-"); return d.length>=2 ? b[Number(d[1])-1]+" "+d[0] : String(s); }
function splash(m){ document.getElementById("wrap").innerHTML = '<div class="splash">'+m+'</div>'; }

function urlAPI() {
  return (MOD === "login")
    ? API + "?aksi=pembeliladang-dash&access_token=" + encodeURIComponent((SESI && SESI.access_token) || "") + "&_=" + Date.now()
    : API + "?aksi=pembeliladang-dash&token=" + encodeURIComponent(TOKEN) + "&_=" + Date.now();
}
function muat() {
  if (!D) splash("Memuatkan…");
  var p = (window.PRATONTON_DATA) ? Promise.resolve(window.PRATONTON_DATA) : fetch(urlAPI()).then(function(r){ return r.json(); });
  p.then(function(d){
    if (!d || !d.ok) {
      if (MOD === "login" && /sesi tidak sah|tamat tempoh/i.test(String((d||{}).error||""))) { location.href = "login.html"; return; }
      splash("⚠️ " + esc((d||{}).error || "Pautan tidak sah atau telah dimatikan.")); return;
    }
    D = d; lukis(d);
    var nav = document.getElementById("navPhmt");
    if (nav && window.PHMT && d.peranans) PHMT.lukis(nav, d.peranans, "PEMBELI_HASIL_LADANG");
  }).catch(function(e){ splash("⚠️ Gagal memuatkan: " + esc(e)); });
}

function lukis(d) {
  var k = d.kpi || {};
  var neg = Number(k.beza_bts_pct || 0) < -5;
  var h = '';
  h += '<div class="kpis">'
    +  '<div class="kbox"><div class="l">Penghantaran direkod</div><div class="v">' + (k.bil_penghantaran||0) + '</div><div class="s">' + (k.bil_blok||0) + ' blok</div></div>'
    +  '<div class="kbox"><div class="l">Jumlah tan FFB</div><div class="v">' + Number(k.tan||0).toFixed(2) + '</div><div class="s">' + tkh(k.tarikh_mula) + ' – ' + tkh(k.tarikh_akhir) + '</div></div>'
    +  '<div class="kbox"><div class="l">Nilai dibeli</div><div class="v">' + rm0(k.kasar) + '</div><div class="s">bersih selepas potongan ' + rm0(k.bersih) + '</div></div>'
    +  '<div class="kbox"><div class="l">Harga purata diterima</div><div class="v">' + rm0(k.harga_purata) + '/tan</div>'
    +    '<div class="s">rujukan BTS ' + rm0(k.bts) + '/tan · <b class="' + (neg ? "badge kurang" : "badge more") + '">' + (Number(k.beza_bts_pct||0) >= 0 ? "+" : "") + Number(k.beza_bts_pct||0).toFixed(1) + '%</b></div></div>'
    +  '</div>';

  var am = d.amaran || [];
  for (var i=0;i<am.length;i++){
    var ok = /premium/i.test(am[i]);
    h += '<div class="amaran' + (ok ? " ok" : "") + '">' + esc(am[i]) + '</div>';
  }

  h += '<div class="kad"><h2>📊 Penghantaran FFB anda</h2>';
  if (!(d.penghantaran||[]).length) {
    h += '<div class="hint">Tiada rekod penghantaran lagi. Rekod akan muncul selepas penyata pertama direkodkan.</div>';
  } else {
    h += '<table><tr><th>Tarikh</th><th>Blok</th><th>Tan</th><th>Harga</th><th>Kasar</th><th>No. Penyata</th></tr>';
    (d.penghantaran||[]).forEach(function(x){
      h += '<tr><td>' + tkh(x.tarikh) + '</td><td>' + esc(x.blok) + '</td><td>' + Number(x.tan||0).toFixed(2) + '</td><td>' + rm0(x.harga) + '</td><td>' + rm(x.kasar) + '</td><td>' + esc(x.chit||"—") + '</td></tr>';
    });
    h += '</table>';
  }
  h += '</div>';

  h += '<div class="kad"><h2>🗓️ Ikhtisar bulanan</h2>';
  if (!(d.bulanan||[]).length) h += '<div class="hint">Belum ada data bulanan.</div>';
  else {
    h += '<table><tr><th>Bulan</th><th>Bilangan</th><th>Tan</th><th>Nilai</th><th>Harga purata</th></tr>';
    (d.bulanan||[]).forEach(function(x){
      h += '<tr><td>' + bln(x.bulan) + '</td><td>' + (x.bil||0) + '</td><td>' + Number(x.tan||0).toFixed(2) + '</td><td>' + rm0(x.nilai) + '</td><td>' + rm0(x.harga_purata) + '</td></tr>';
    });
    h += '</table>';
  }
  h += '</div>';

  h += '<div class="kad"><h2>📄 Bil &amp; tuntutan</h2>';
  if (!(d.bil||[]).length) h += '<div class="hint">Tiada bil atau tuntutan direkodkan. (Kos potong/rawatan diambil dari nilai FFB sebelum bayaran.)</div>';
  else {
    h += '<table><tr><th>Tarikh</th><th>No. Bil</th><th>Tempoh</th><th>Jumlah kos</th><th>Diclaim</th><th>Baki</th></tr>';
    (d.bil||[]).forEach(function(x){
      h += '<tr><td>' + tkh(x.tarikh) + '</td><td>' + esc(x.no_bil||"—") + '</td><td>' + tkh(x.dari) + ' – ' + tkh(x.hingga) + '</td><td>' + rm(x.jumlah_kos) + '</td><td>' + rm(x.diclaim) + '</td><td>' + rm(x.baki_hadapan) + '</td></tr>';
    });
    h += '</table>';
  }
  h += '</div>';

  h += '<div class="kad"><h2>🏭 Profil pihak berdaftar</h2>';
  if (!d.profil) h += '<div class="hint">Rekod pendaftaran/licence belum dimasukkan ke dalam sistem. Sila hubungi SAT untuk pengemaskinian.</div>';
  else {
    var p = d.profil;
    h += '<div class="row"><span>Nama</span><b>' + esc(p.nama) + '</b></div>'
      +  '<div class="row"><span>Peranan</span><b>' + esc(p.peranan||"—") + '</b></div>'
      +  '<div class="row"><span>No. SSM</span><b>' + esc(p.ssm||"—") + '</b></div>'
      +  '<div class="row"><span>Lesen</span><b>' + esc((p.jenis_lesen||"—") + (p.no_lesen ? " · " + p.no_lesen : "")) + '</b></div>'
      +  '<div class="row"><span>PIC</span><b>' + esc(p.pic||"—") + '</b></div>'
      +  '<div class="row"><span>Status</span><b>' + esc(p.status||"—") + '</b></div>';
  }
  h += '</div>';

  var hr = d.harga || {};
  h += '<div class="kad"><h2>💹 Harga rujukan BTS/MPOB</h2>'
    +  '<div class="row"><span>CPO MPOB (bulan semasa)</span><b>' + rm0(hr.cpo) + '/tan</b></div>'
    +  '<div class="row"><span>RM per 1% OER</span><b>' + Number(hr.rm_1oer||0).toFixed(2) + '</b></div>'
    +  '<div class="row"><span>FFB anggaran (CPO × OER 20%)</span><b>' + rm0(hr.ffb_anggaran) + '/tan</b></div>'
    +  '<div class="row"><span>Bulan rujukan</span><b>' + esc(hr.bulan||"—") + '</b></div>'
    +  '<div class="hint">Harga rujukan sahaja — harga sebenar dinilai ikut gred/OER dan potongan di kilang.</div>'
    +  '</div>'
    +  '<div class="kad"><h2>☎️ Hubungi SAT</h2>'
    +  '<a class="btn" href="https://wa.me/60163119076?text=' + encodeURIComponent("Salam, saya pembeli hasil ladang — ingin tanya tentang penyata FFB.") + '">WhatsApp Mr Tanah</a>'
    +  '<a class="btn alt" href="mailto:mrtanahmy@gmail.com">Emel</a>'
    +  '<div class="hint">Pengendali: Strategic Agro Technology (SAT) · diurus oleh Mr Tanah.</div></div>';

  document.getElementById("wrap").innerHTML = h;
}

(function init(){
  var A = window.AUTH || {};
  if (window.PRATONTON_DATA) { muat(); return; }
  if (!A.url || !A.key || typeof window.supabase === "undefined") {
    if (TOKEN) muat(); else splash("⚠️ Pautan tidak lengkap (tiada token). Guna pautan dari Mr Tanah, atau log masuk.");
    return;
  }
  SB = window.supabase.createClient(A.url, A.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  SB.auth.getSession().then(function(o){
    SESI = (o.data && o.data.session) || null;
    if (SESI) { MOD = "login"; muat(); return; }
    if (TOKEN) { MOD = "token"; muat(); return; }
    location.href = "login.html";
  });
})();
</script>
</body>
</html>
