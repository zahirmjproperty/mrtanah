<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Owner Dashboard — Property Portfolio — Zentra Portal</title>
<meta name="description" content="Papan pemuka pemilik hartanah — portfolio unit, kutipan sewa, bil utiliti, kos penyelenggaraan & anggaran bersih. Mr Tanah.">
<style>
  :root { --mt:#123a7a; --mt-tua:#0a1f44; --hijau:#14905c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; background:#f2f6f4; color:#1d2b24; line-height:1.45; }
  .topbar { background:linear-gradient(135deg,#0a5c3c 0%,#123a7a 58%,#14905c 100%); color:#fff; padding:16px; }
  .topbar h1 { margin:0 0 3px; font-size:20px; }
  .topbar p { margin:0; font-size:12.5px; opacity:.95; }
  .crumbs { font-size:12px; opacity:.9; margin-top:4px; }
  .crumbs a { color:#fff; }
  .wrap { max-width:1040px; margin:0 auto; padding:16px 14px 46px; }
  .splash { text-align:center; color:#5a6b61; padding:40px 0; font-size:14px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:10px; }
  .kpi { background:#fff; border:1px solid #dde5f2; border-radius:12px; padding:13px; }
  .kpi b { display:block; font-size:21px; line-height:1.15; }
  .kpi span { display:block; font-size:12px; color:#5a6b61; margin-top:3px; }
  .kpi em { display:block; font-size:11px; color:#87968d; font-style:normal; margin-top:2px; }
  .card { background:#fff; border:1px solid #dde5f2; border-radius:12px; padding:14px; margin-top:16px; }
  .card h2 { margin:0 0 10px; font-size:15px; color:var(--mt-tua); }
  .al { border-radius:10px; padding:10px 13px; margin-bottom:8px; font-size:13px; }
  .al b { display:block; }
  .al span { color:#42546b; }
  table { width:100%; border-collapse:collapse; font-size:12.6px; }
  th,td { text-align:left; padding:7px 6px; border-bottom:1px solid #eef2f6; vertical-align:top; }
  th { font-size:11.3px; text-transform:uppercase; letter-spacing:.3px; color:#5a6b61; white-space:nowrap; }
  td.kanan, th.kanan { text-align:right; white-space:nowrap; }
  .pil { display:inline-block; font-size:11px; font-weight:700; border-radius:20px; padding:2px 9px; white-space:nowrap; }
  .pil.hijau { background:#e6f5ee; color:#0e5a33; }
  .pil.merah { background:#fdeaea; color:#a11; }
  .pil.biru { background:#eaf0fb; color:var(--mt); }
  .pil.kelabu { background:#eef1f4; color:#5a6b61; }
  .pil.kuning { background:#fff4e2; color:#8a4c00; }
  .dua { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:780px) { .dua { grid-template-columns:1fr; } }
  .nota { font-size:11.6px; color:#5a6b61; margin-top:9px; }
  .bar { background:#e6ebe8; border-radius:6px; height:9px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--hijau); }
  .btnrow { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .btn { background:var(--mt); color:#fff; border:none; border-radius:9px; padding:10px 15px; font-size:13.5px; font-weight:600; cursor:pointer; }
  .btn.ghost { background:#fff; color:var(--mt); border:1.5px solid #c9d6ec; }
  .hint { font-size:12px; color:#5a6b61; }
  .err { color:#a11; font-size:13px; }
  input { padding:11px; border:1.5px solid #cfdcd4; border-radius:10px; font-size:14px; width:100%; }
  .foot { text-align:center; font-size:11.5px; color:#5a6b61; padding:20px 10px 30px; }
  .formula { background:#f7f9fc; border:1px dashed #a9bfd9; border-radius:10px; padding:10px 12px; font-size:12.2px; color:#42546b; margin-top:10px; }
</style>
</head>
<body>
  <div class="topbar">
    <h1>🏠 Owner Dashboard</h1>
    <p>Your property portfolio — managed by ZMJ Solutions (Mr Tanah)</p>
    <p style="margin:2px 0 0;font-size:11px;opacity:.85">versi v3-snapshot</p>
    <div class="crumbs"><a href="/">← Zentra Portal</a></div>
  </div>
  <div class="wrap" id="wrap"><div class="splash">Loading…</div></div>
  <div class="foot">Private link — do not share. Enquiries: WhatsApp 016-3119076.</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/auth-config.js?v=2"></script>
<script src="assets/auth-nav.js?v=9"></script>
<script>
var API = "https://script.google.com/macros/s/AKfycbwafaViIuCpc-Q0XnUpSHgkKVTFcyfPProf0GvSi9C-L22hUsZ_NA-03wXjd2F-GRIS/exec";
var T = new URLSearchParams(location.search).get("t") || localStorage.getItem("mt_pemilik_token") || "";
var D = null;
var MOD = "token";        /* "token" = legacy link · "login" = signed-in session */
var SESI = null, SB = null;

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function rm(n, dec) { return "RM" + Number(n || 0).toLocaleString("ms-MY", { minimumFractionDigits: dec == null ? 2 : dec, maximumFractionDigits: dec == null ? 2 : dec }); }
function tkh(s) { if (!s) return "—"; var d = String(s).substring(0, 10).split("-"); return d.length === 3 ? d[2] + "/" + d[1] + "/" + d[0] : String(s); }
function splash(m) { document.getElementById("wrap").innerHTML = '<div class="splash">' + esc(m) + '</div>'; }

function pilStatus(txt) {
  var t = String(txt || "").toUpperCase(), c = "kelabu";
  if (t.indexOf("BELUM") >= 0 || t.indexOf("TERTUNGGAK") >= 0) c = "merah";
  else if (t.indexOf("DIBAYAR") >= 0 || t.indexOf("SELESAI") >= 0) c = "hijau";
  else if (t.indexOf("SEBUT HARGA") >= 0 || t.indexOf("QC") >= 0) c = "kuning";
  else if (t) c = "biru";
  return '<span class="pil ' + c + '">' + esc(txt || "—") + '</span>';
}

function tiadaAkses(m) {
  document.getElementById("wrap").innerHTML = '<div class="card" style="max-width:520px;margin:24px auto">'
    + '<h2>Invalid link</h2><p class="hint">' + esc(m) + ' If you are an owner of a unit managed by Mr Tanah, '
    + 'contact WhatsApp <b>016-3119076</b> for a new link.</p></div>';
}

function muat() {
  /* Snapshot first (same-domain file, fast and RELIABLE) — avoids Apps Script timeout limits */
  splash("Loading…");
  const snap = "data/pemilik-" + encodeURIComponent(T) + ".json";
  fetch(snap + "?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("no snapshot"); return r.json(); })
    .then(function (d) { if (!d.ok) throw new Error("invalid snapshot"); D = d; D.__snap = 1; lukis(); })
    .catch(function () { muatLive(true); });
}

function muatLive(gunaSandaran) {
  /* Live data (Apps Script) — slower; use when the user asks for it or no snapshot exists */
  splash("Contacting the server… (this may take 10–30 seconds)");
  var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
  var tamat = setTimeout(function () { if (ctrl) ctrl.abort(); }, 45000);
  var urlAPI = (MOD === "login")
    ? API + "?aksi=pemilik&access_token=" + encodeURIComponent((SESI && SESI.access_token) || "") + "&_=" + Date.now()
    : API + "?aksi=pemilik&token=" + encodeURIComponent(T) + "&_=" + Date.now();
  fetch(urlAPI, ctrl ? { signal: ctrl.signal } : undefined)
    .then(function (r) { clearTimeout(tamat); return r.json(); })
    .then(function (d) {
      if (!d.ok) {
        var em = String(d.error || "");
        if (MOD === "login") {
          if (/sesi tidak sah|tamat tempoh/i.test(em)) { document.getElementById("wrap").innerHTML = '<div class="card" style="max-width:520px;margin:24px auto"><h2>Session expired</h2><p class="hint">Please sign in again.</p><div class="btnrow" style="margin-top:12px"><a class="btn" style="text-decoration:none" href="login.html">🔐 Sign in</a></div></div>'; return; }
          tiadaAkses(em || "This account is not yet registered for the portal."); return;
        }
        localStorage.removeItem("mt_pemilik_token"); tiadaAkses(em || "Invalid or expired link."); return;
      }
      D = d; D.__snap = 0; lukis();
    })
    .catch(function (e) {
      clearTimeout(tamat);
      if (D) { lukis(); amaranKecil("⚠️ Live data failed to load (" + String(e).slice(0, 60) + "). This view is the snapshot from " + (D.masa || "") + "."); return; }
      document.getElementById("wrap").innerHTML = '<div class="card" style="max-width:520px;margin:24px auto">'
        + '<h2>⚠️ Data could not be loaded</h2><p class="hint">The snapshot is not available yet and the live connection failed. '
        + 'Try again in a moment; if it keeps happening, contact WhatsApp 016-3119076.</p>'
        + '<p class="hint" style="color:#a11">' + esc(String(e).slice(0, 110)) + '</p>'
        + '<div class="btnrow" style="margin-top:12px"><button class="btn" id="bCuba">🔄 Try again</button></div></div>';
      var b = document.getElementById("bCuba"); if (b) b.onclick = function () { muatLive(true); };
    });
}

function amaranKecil(mesej) {
  var el = document.getElementById("amaranKecil");
  if (!el) { el = document.createElement("div"); el.id = "amaranKecil"; el.className = "al";
    el.style.cssText = "background:#fff4e2;border-left:5px solid #8a4c00;margin:10px 0";
    var w = document.getElementById("wrap"); if (w && w.firstChild) w.insertBefore(el, w.firstChild); }
  el.textContent = mesej;
}

function lukis() {
  var k = D.kpi, warna = { merah: "#b3261e", kuning: "#8a4c00", biru: "#123a7a", hijau: "#14905c" },
      latar = { merah: "#fdeaea", kuning: "#fff4e2", biru: "#eaf0fb", hijau: "#e6f5ee" };
  function kpi(nilai, label, nota, w) {
    return '<div class="kpi"><b style="color:' + (w || "#123a7a") + '">' + esc(nilai) + '</b><span>' + esc(label) + '</span>'
      + (nota ? '<em>' + esc(nota) + '</em>' : '') + '</div>';
  }
  var badge = D.__snap ? ('📦 Snapshot ' + esc(D.masa || '')) : ('🟢 Live data ' + esc(D.masa || ''));
  var h = '<div id="navPhmt"></div>'
    + '<p class="hint" style="margin:0 0 10px">Owner: <b>' + esc(D.pemilik) + '</b> · ' + badge
    + (MOD === "login" ? ' · <a href="#" id="bKeluar" style="color:#0a5">Sign out</a>' : '') + '</p>'
    + '<div class="kpis">'
    + kpi(k.unit_sewaan, "Units rented", k.unit_jumlah + " units in the portfolio")
    + kpi(rm(k.sewa_bulanan, 0), "Monthly rent (contract)", "period " + (k.inv_tempoh || "—"))
    + kpi(rm(k.inv_diterima), "Collected this period", "raised " + rm(k.inv_dijana), "#14905c")
    + kpi(rm(k.inv_tertunggak), "Unpaid by tenants", k.inv_belum_bilangan + " invoices", "#b3261e")
    + kpi(rm(k.bil_pemilik_belum), "Utility bills (your responsibility)", "units without a tenant", "#8a4c00")
    + kpi(rm(k.kos_kerja_pemilik), "Maintenance cost", "including MT management cost")
    + kpi(rm(k.anggaran_bersih), "Estimated net", "rent received − costs", k.anggaran_bersih < 0 ? "#b3261e" : "#14905c")
    + '</div>';

  h += '<div class="card"><h2>⚡ Needs attention</h2>';
  (D.amaran || []).forEach(function (a) {
    h += '<div class="al" style="background:' + (latar[a.tahap] || "#eef1f4") + ';border-left:5px solid ' + (warna[a.tahap] || "#5a6b61") + '">'
      + '<b>' + esc(a.tajuk) + '</b><span>' + esc(a.butir) + '</span></div>';
  });
  h += '</div>';

  h += '<div class="card"><h2>🏠 My unit portfolio</h2><div style="overflow-x:auto"><table>'
    + '<thead><tr><th>Property</th><th>Name</th><th>Type</th><th>Status</th><th>Tenant</th><th class="kanan">Rent/mth</th></tr></thead><tbody>'
    + (D.unit || []).map(function (u) {
        return '<tr><td><b>' + esc(u.id) + '</b></td><td>' + esc(u.nama) + '</td><td>' + esc(u.jenis) + '</td>'
          + '<td>' + pilStatus(u.status || (u.pemilikan ? "Own account" : "")) + '</td>'
          + '<td>' + esc(u.penyewa || "—") + '</td><td class="kanan">' + (u.sewa ? rm(u.sewa, 0) : "—") + '</td></tr>';
      }).join('')
    + '</tbody></table></div></div>';

  h += '<div class="card"><h2>💵 Rent invoices ' + esc(k.inv_tempoh || "") + '</h2><div style="overflow-x:auto"><table>'
    + '<thead><tr><th>Invoice</th><th>Property</th><th>Tenant</th><th class="kanan">Rent</th><th class="kanan">Utilities</th>'
    + '<th class="kanan">Amount</th><th>Due</th><th>Status</th></tr></thead><tbody>'
    + (D.invois || []).map(function (i) {
        return '<tr><td><b>' + esc(i.id) + '</b></td><td>' + esc(i.unit) + '</td><td>' + esc(i.penyewa) + '</td>'
          + '<td class="kanan">' + rm(i.sewa) + '</td><td class="kanan">' + rm(i.utiliti) + '</td>'
          + '<td class="kanan"><b>' + rm(i.jumlah) + '</b></td><td>' + tkh(i.due) + '</td><td>' + pilStatus(i.status) + '</td></tr>';
      }).join('')
    + '</tbody></table></div><p class="nota">Utilities in the invoice are a <b>pass-through</b> — charged to the tenant, not owner income.</p></div>';

  h += '<div class="dua">'
    + '<div class="card"><h2>🧾 Unpaid utility bills</h2><div style="overflow-x:auto"><table>'
    + '<thead><tr><th>Bill</th><th>Property</th><th>Type</th><th class="kanan">Amount</th><th>Due</th><th>Borne by</th></tr></thead><tbody>'
    + (D.bil_belum || []).map(function (b) {
        return '<tr><td><b>' + esc(b.id) + '</b></td><td>' + esc(b.unit) + '</td><td>' + esc(b.jenis + " " + b.tempoh) + '</td>'
          + '<td class="kanan">' + rm(b.amaun) + '</td><td>' + tkh(b.due) + '</td>'
          + '<td>' + (b.passthru ? '<span class="pil biru">Tenant</span>' : '<span class="pil kuning">Owner</span>') + '</td></tr>';
      }).join('')
    + '</tbody></table></div><p class="nota">Unpaid: <b>' + rm(k.bil_pemilik_belum) + '</b> owner&#39;s responsibility · <b>'
    + rm(k.bil_penyewa_belum) + '</b> tenant pass-through.</p></div>'
    + '<div class="card"><h2>🔧 Maintenance on my units</h2><div style="overflow-x:auto"><table>'
    + '<thead><tr><th>Reference</th><th>Property</th><th>Type</th><th>Status</th><th class="kanan">Cost</th></tr></thead><tbody>'
    + ((D.tiket || []).length ? (D.tiket || []).map(function (t) {
        return '<tr><td><b>' + esc(t.ref) + '</b></td><td>' + esc(t.unit) + '</td><td>' + esc(t.jenis) + '</td>'
          + '<td>' + pilStatus(t.status) + '</td><td class="kanan">' + (t.nilai ? rm(t.nilai) : "—")
          + (t.kos_pengurusan ? '<br><span class="nota">+ ' + rm(t.kos_pengurusan) + ' mgmt</span>' : '') + '</td></tr>';
      }).join('') : '<tr><td colspan="5" class="hint">No maintenance records for your units.</td></tr>')
    + '</tbody></table></div></div>'
    + '</div>';

  h += '<div class="card"><h2>ℹ️ How these figures are calculated</h2>'
    + '<div class="formula">' + esc(D.nota || "") + '</div>'
    + '<ul class="nota" style="padding-left:18px">'
    + '<li>Source: the DB &amp; Bill workbook (property/bill/invoice tabs) + MT work records — read directly, with no re-typing.</li>'
    + '<li>Rent received this period: <b>' + rm(k.sewa_diterima) + '</b> · pass-through utilities received: <b>' + rm(k.utiliti_diterima) + '</b>.</li>'
    + '<li>Total collected across all periods: <b>' + rm(k.diterima_semua_tempoh) + '</b>.</li>'
    + '<li>The estimated net is for the current month only (not an official statement of account).</li>'
    + '</ul><div class="btnrow" style="margin-top:12px"><button class="btn ghost" id="bRe">🔄 Pull latest data</button>'
    + '<a class="btn ghost" style="text-decoration:none" href="https://wa.me/60163119076?text=Saya%20ada%20pertanyaan%20tentang%20portfolio%20hartanah%20saya">💬 Ask Mr Tanah</a></div>'
    + '<p class="nota">The normal view is a <b>snapshot</b> (updated automatically every 15 minutes) so the page always stays fast. '
    + 'The <b>Pull latest data</b> button tries to pull live data from the MT database (this may take 10–30 seconds).</p></div>';

  document.getElementById("wrap").innerHTML = h;
  var bRe = document.getElementById("bRe"); if (bRe) bRe.onclick = function () { muatLive(false); };
  var navEl = document.getElementById("navPhmt");
  if (navEl && window.PHMT && D.peranans) PHMT.lukis(navEl, D.peranans, "PEMILIK_HARTANAH");
  var bK = document.getElementById("bKeluar");
  if (bK) bK.onclick = function (e) { e.preventDefault(); try { SB.auth.signOut(); } catch (x) {} localStorage.removeItem("mt_pemilik_token"); location.href = "login.html"; };
}

(function init() {
  var A = window.AUTH || {};
  if (!A.url || !A.key || typeof window.supabase === "undefined") {
    /* No SDK/config → use the legacy token route only */
    if (T) { localStorage.setItem("mt_pemilik_token", T); muat(); }
    else tiadaAkses("No token in the link. Open the full link given by Mr Tanah (…/pemilik.html?t=…) or sign in.");
    return;
  }
  SB = window.supabase.createClient(A.url, A.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  SB.auth.getSession().then(function (o) {
    SESI = (o.data && o.data.session) || null;
    if (SESI) { MOD = "login"; muat(); return; }
    if (T) { MOD = "token"; localStorage.setItem("mt_pemilik_token", T); muat(); return; }
    location.href = "login.html";
  });
})();
</script>
</body>
</html>
